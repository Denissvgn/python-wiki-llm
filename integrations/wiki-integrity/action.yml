name: LLM Wiki full integrity gate
description: Validate a committed LLM Wiki with locked toolchains and bounded evidence.

inputs:
  wiki-dir:
    description: Repository-relative path to the committed LLM Wiki directory.
    required: false
    default: docs/llm_wiki
  src-dir:
    description: Repository-relative source root; its default source-selection profile is discovered automatically.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Check out the candidate without credentials
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Python 3.13
      id: setup-python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"

    - name: Install the action package
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: >-
        "${{ steps.setup-python.outputs.python-path }}"
        -I -m pip install --no-cache-dir
        "${GITHUB_ACTION_PATH}/../.."

    - name: Bind runner-temporary wiki paths
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: |
        set -euo pipefail
        cache_dir="${RUNNER_TEMP}/llm-wiki-cache"
        evidence_dir="${RUNNER_TEMP}/llm-wiki-evidence"
        occupied=false
        for reserved_dir in "${cache_dir}" "${evidence_dir}"; do
          if [[ -e "${reserved_dir}" || -L "${reserved_dir}" ]]; then
            occupied=true
            printf 'Runner-temporary path is already occupied: %s\n' \
              "${reserved_dir}" >&2
          fi
        done
        if ${occupied}; then
          quarantine_dir="$(
            /usr/bin/mktemp -d "${RUNNER_TEMP}/llm-wiki-collisions.XXXXXX"
          )"
          for reserved_dir in "${cache_dir}" "${evidence_dir}"; do
            if [[ -e "${reserved_dir}" || -L "${reserved_dir}" ]]; then
              leaf="${reserved_dir##*/}"
              if ! /bin/mv -- \
                "${reserved_dir}" "${quarantine_dir}/${leaf}"; then
                /bin/rm -rf -- "${reserved_dir}"
              fi
              [[ ! -e "${reserved_dir}" && ! -L "${reserved_dir}" ]]
            fi
          done
          exit 1
        fi
        for reserved_dir in "${cache_dir}" "${evidence_dir}"; do
          mkdir -- "${reserved_dir}"
          [[ -d "${reserved_dir}" && ! -L "${reserved_dir}" ]]
        done
        {
          printf 'LLM_WIKI_CACHE_DIR=%s\n' "${cache_dir}"
          printf 'LLM_WIKI_EVIDENCE_DIR=%s\n' "${evidence_dir}"
        } >> "${GITHUB_ENV}"

    - name: Plan the automatically selected extractor helpers
      id: extractor-plan
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
        INPUT_SRC_DIR: ${{ inputs.src-dir }}
      run: |
        set -euo pipefail
        plan_path="${LLM_WIKI_EVIDENCE_DIR}/extractor-plan.json"
        "${{ steps.setup-python.outputs.python-path }}" \
          -I -m llm_wiki_cli.cli prepare-extractors \
          --src-dir "${INPUT_SRC_DIR}" \
          --plan \
          --format json > "${plan_path}"

        "${{ steps.setup-python.outputs.python-path }}" \
          -I - "${plan_path}" "${GITHUB_OUTPUT}" <<'PY'
        import json
        import pathlib
        import sys

        expected_schema = "llm-wiki-prepare-extractors-plan/v1"
        supported = ("typescript", "go", "rust", "haskell")
        plan_path = pathlib.Path(sys.argv[1])
        output_path = pathlib.Path(sys.argv[2])

        def fail(message):
            raise SystemExit(f"invalid extractor-helper plan: {message}")

        if plan_path.is_symlink() or not plan_path.is_file():
            fail("output is not a regular file")
        try:
            raw = plan_path.read_bytes()
        except OSError as exc:
            fail(f"output cannot be read: {exc}")
        if not raw or len(raw) > 4096:
            fail("output size is outside the accepted bounds")
        try:
            pairs = json.loads(
                raw.decode("utf-8"),
                object_pairs_hook=lambda value: value,
                parse_constant=lambda value: fail(
                    f"non-standard JSON constant {value!r}"
                ),
            )
        except (UnicodeDecodeError, json.JSONDecodeError) as exc:
            fail(f"output is not strict UTF-8 JSON: {exc}")
        if not isinstance(pairs, list) or not all(
            isinstance(pair, tuple) and len(pair) == 2 for pair in pairs
        ):
            fail("top level must be an object")
        if [key for key, _value in pairs] != ["schema", "languages"]:
            fail("object keys or key order do not match the v1 contract")
        payload = dict(pairs)
        if payload["schema"] != expected_schema:
            fail("schema is unsupported")
        languages = payload["languages"]
        if not isinstance(languages, list) or any(
            type(language) is not str for language in languages
        ):
            fail("languages must be an array of strings")
        canonical_languages = [
            language for language in supported if language in languages
        ]
        if languages != canonical_languages:
            fail("languages are unknown, duplicated, or out of canonical order")

        try:
            with output_path.open("a", encoding="utf-8", newline="\n") as output:
                for language in supported:
                    selected = "true" if language in languages else "false"
                    output.write(f"{language}={selected}\n")
        except OSError as exc:
            fail(f"step outputs cannot be written: {exc}")
        PY

    - name: Install the locked TypeScript and JavaScript extractor toolchain
      if: steps.extractor-plan.outputs.typescript == 'true'
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: >-
        "${GITHUB_ACTION_PATH}/../../.github/scripts/setup-llm-wiki-ci-toolchains.sh"
        --mode routine
        --install-root "${RUNNER_TEMP}/llm-wiki-toolchains"
        --lock "${GITHUB_ACTION_PATH}/../../release/toolchain-lock.json"
        --python "${{ steps.setup-python.outputs.python-path }}"

    - name: Install the locked Go extractor toolchain
      if: steps.extractor-plan.outputs.go == 'true'
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: >-
        "${GITHUB_ACTION_PATH}/../../.github/scripts/setup-llm-wiki-ci-toolchains.sh"
        --mode extractor-go
        --install-root "${RUNNER_TEMP}/llm-wiki-toolchains"
        --lock "${GITHUB_ACTION_PATH}/../../release/toolchain-lock.json"
        --python "${{ steps.setup-python.outputs.python-path }}"

    - name: Install the locked Rust extractor toolchain
      if: steps.extractor-plan.outputs.rust == 'true'
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: >-
        "${GITHUB_ACTION_PATH}/../../.github/scripts/setup-llm-wiki-ci-toolchains.sh"
        --mode extractor-rust
        --install-root "${RUNNER_TEMP}/llm-wiki-toolchains"
        --lock "${GITHUB_ACTION_PATH}/../../release/toolchain-lock.json"
        --python "${{ steps.setup-python.outputs.python-path }}"

    - name: Install the locked Haskell extractor toolchain
      if: steps.extractor-plan.outputs.haskell == 'true'
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: >-
        "${GITHUB_ACTION_PATH}/../../.github/scripts/setup-llm-wiki-ci-toolchains.sh"
        --mode extractor-haskell
        --install-root "${RUNNER_TEMP}/llm-wiki-toolchains"
        --lock "${GITHUB_ACTION_PATH}/../../release/toolchain-lock.json"
        --python "${{ steps.setup-python.outputs.python-path }}"

    - name: Record selected locked extractor toolchain versions
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
        PLAN_TYPESCRIPT: ${{ steps.extractor-plan.outputs.typescript }}
        PLAN_GO: ${{ steps.extractor-plan.outputs.go }}
        PLAN_RUST: ${{ steps.extractor-plan.outputs.rust }}
        PLAN_HASKELL: ${{ steps.extractor-plan.outputs.haskell }}
      run: |
        set -euo pipefail
        mkdir -p -- "${LLM_WIKI_EVIDENCE_DIR}"
        qualification_helper="${GITHUB_ACTION_PATH}/../../release/qualification.py"
        toolchain_lock="${GITHUB_ACTION_PATH}/../../release/toolchain-lock.json"
        evidence_path="${LLM_WIKI_EVIDENCE_DIR}/locked-toolchain-versions.txt"

        for selected in \
          "${PLAN_TYPESCRIPT}" "${PLAN_GO}" "${PLAN_RUST}" "${PLAN_HASKELL}"; do
          case "${selected}" in
            true|false) ;;
            *) printf 'Invalid extractor-plan output: %s\n' "${selected}" >&2; exit 1 ;;
          esac
        done

        lock_value() {
          "${{ steps.setup-python.outputs.python-path }}" \
            -I "${qualification_helper}" lock-value \
            --lock "${toolchain_lock}" \
            --key "$1"
        }

        record_exact_version() {
          local name="$1"
          local expected="$2"
          local actual="$3"
          {
            printf '%s expected: %s\n' "${name}" "${expected}"
            printf '%s actual: %s\n' "${name}" "${actual}"
          } | tee -a "${evidence_path}"
          test "${actual}" = "${expected}"
        }

        : > "${evidence_path}"
        {
          printf 'typescript selected: %s\n' "${PLAN_TYPESCRIPT}"
          printf 'go selected: %s\n' "${PLAN_GO}"
          printf 'rust selected: %s\n' "${PLAN_RUST}"
          printf 'haskell selected: %s\n' "${PLAN_HASKELL}"
        } | tee -a "${evidence_path}"

        if [[ "${PLAN_TYPESCRIPT}" == "true" ]]; then
          record_exact_version \
            node \
            "$(lock_value toolchains.node.version_output)" \
            "$(node --version)"
          record_exact_version \
            npm \
            "$(lock_value toolchains.npm.version_output)" \
            "$(npm --version)"
        fi

        if [[ "${PLAN_GO}" == "true" ]]; then
          test -n "${LLM_WIKI_GO:-}" && test -x "${LLM_WIKI_GO}"
          actual_go_full="$("${LLM_WIKI_GO}" version)"
          read -r go_word version_word version_value go_platform go_extra \
            <<< "${actual_go_full}"
          test -z "${go_extra:-}"
          record_exact_version \
            go \
            "$(lock_value toolchains.go.version_output)" \
            "${go_word} ${version_word} ${version_value}"
          printf 'go platform: %s\n' "${go_platform}" | tee -a "${evidence_path}"
        fi

        if [[ "${PLAN_RUST}" == "true" ]]; then
          record_exact_version \
            cargo \
            "$(lock_value toolchains.rust.version_output)" \
            "$(cargo --version)"
        fi

        if [[ "${PLAN_HASKELL}" == "true" ]]; then
          test -n "${LLM_WIKI_GHC:-}" && test -x "${LLM_WIKI_GHC}"
          record_exact_version \
            ghc \
            "$(lock_value toolchains.haskell.version_output)" \
            "$("${LLM_WIKI_GHC}" --numeric-version)"
        fi

    - name: Prepare the automatically selected extractor helpers
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
        INPUT_SRC_DIR: ${{ inputs.src-dir }}
      run: |
        set -euo pipefail
        "${{ steps.setup-python.outputs.python-path }}" \
          -I -m llm_wiki_cli.cli prepare-extractors \
          --src-dir "${INPUT_SRC_DIR}" \
          --cache-dir "${LLM_WIKI_CACHE_DIR}" \
          2>&1 | tee "${LLM_WIKI_EVIDENCE_DIR}/prepare-extractors.log"

    - name: Validate committed wiki (native drift diagnostics are advisory)
      shell: bash
      env:
        CI: "true"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
        INPUT_SRC_DIR: ${{ inputs.src-dir }}
        INPUT_WIKI_DIR: ${{ inputs.wiki-dir }}
      run: >-
        "${GITHUB_ACTION_PATH}/../../.github/scripts/run-llm-wiki-ci-check.sh"
        --python "${{ steps.setup-python.outputs.python-path }}"
        --src-dir "${INPUT_SRC_DIR}"
        --wiki-dir "${INPUT_WIKI_DIR}"
        --helper-cache-dir "${LLM_WIKI_CACHE_DIR}"
        --report-dir "${LLM_WIKI_EVIDENCE_DIR}"
        --jobs 1
        --knowledge-drift-report

    - name: Upload bounded wiki integrity evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: llm-wiki-ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        path: |
          ${{ runner.temp }}/llm-wiki-evidence/llm-wiki-ci-report.md
          ${{ runner.temp }}/llm-wiki-evidence/llm-wiki-ci-report.json
          ${{ runner.temp }}/llm-wiki-evidence/llm-wiki-ci-report.invalid.txt
          ${{ runner.temp }}/llm-wiki-evidence/extractor-plan.json
          ${{ runner.temp }}/llm-wiki-evidence/prepare-extractors.log
          ${{ runner.temp }}/llm-wiki-evidence/locked-toolchain-versions.txt
        retention-days: 14
        if-no-files-found: warn
