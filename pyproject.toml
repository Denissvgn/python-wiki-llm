[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "release_build_backend"
backend-path = ["."]

[project]
name = "agent-wiki-cli"
version = "1.8.1"
description = "CLI tool to maintain hybrid LLM Wikis for multi-language projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Denis Sivagin", email = "denissvgn@gmail.com"}
]
keywords = ["llm", "wiki", "documentation", "ai", "agents", "code-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "PyYAML>=6",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.18",
    "markdown-it-py>=4.0,<5",
    "setuptools==83.0.0",
]
# TypeScript extraction requires Node.js + npm at runtime (no Python deps).
# Prepare the locked dependency cache with `llm-wiki prepare-extractors`.
typescript = []
# Go extraction requires the Go toolchain at runtime (no Python deps).
go = []
# Rust extraction requires the Rust toolchain (cargo) at runtime (no Python deps).
rust = []
# MCP server support uses the official Python MCP SDK, which requires Python 3.10+.
mcp = [
    "mcp>=1.27,<2; python_version >= '3.10'",
    "pydantic-settings>=2.5.2,<2.15; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/Denissvgn/python-wiki-llm"
Repository = "https://github.com/Denissvgn/python-wiki-llm"
Issues = "https://github.com/Denissvgn/python-wiki-llm/issues"

[project.scripts]
llm-wiki = "llm_wiki_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_wiki_cli" = [
    "schemas/llm-wiki-knowledge-v1.schema.json",
    "extractors/ts_scripts/package.json",
    "extractors/ts_scripts/package-lock.json",
    "extractors/ts_scripts/extract.js",
    "extractors/go_scripts/main.go",
    "extractors/go_scripts/go.mod",
    "extractors/haskell_scripts/Main.hs",
    "extractors/haskell_scripts/Inventory.hs",
    "extractors/haskell_scripts/Parser.hs",
    "extractors/haskell_scripts/Paths.hs",
    "extractors/haskell_scripts/Json.hs",
    "extractors/rust_scripts/Cargo.toml",
    "extractors/rust_scripts/Cargo.lock",
    "extractors/rust_scripts/src/main.rs",
    "examples/plugins/documentation-hooks/detectors.py",
    "examples/plugins/documentation-hooks/llm-wiki-plugin.json",
    "examples/plugins/documentation-hooks/styles.py",
    "skills/agent-docs/SKILL.md",
    "skills/agent-docs/reference.md",
    "skills/attack-surface/SKILL.md",
    "skills/attack-surface/reference.md",
    "skills/dep-audit/SKILL.md",
    "skills/dep-audit/reference.md",
    "skills/dep-vuln-triage/SKILL.md",
    "skills/dep-vuln-triage/reference.md",
    "skills/doc-hub/SKILL.md",
    "skills/doc-hub/reference.md",
    "skills/doc-review/SKILL.md",
    "skills/doc-review/reference.md",
    "skills/impact-analysis/SKILL.md",
    "skills/impact-analysis/reference.md",
    "skills/infra-review/SKILL.md",
    "skills/infra-review/reference.md",
    "skills/onboarding-guide/SKILL.md",
    "skills/onboarding-guide/reference.md",
    "skills/publish-docs/SKILL.md",
    "skills/publish-docs/reference.md",
    "skills/usage-examples/SKILL.md",
    "skills/usage-examples/reference.md",
    "skills/user-docs-author/SKILL.md",
    "skills/user-docs-author/reference.md",
    "skills/wiki-bootstrap/SKILL.md",
    "skills/wiki-bootstrap/reference.md",
    "skills/wiki-reference/SKILL.md",
    "skills/wiki-reference/reference.md",
    "skills/wiki-reference/references/context-query.md",
    "skills/wiki-reference/references/extractors-dependencies.md",
    "skills/wiki-reference/references/governance.md",
    "skills/wiki-reference/references/knowledge-consumption.md",
    "skills/wiki-reference/references/maintenance.md",
    "skills/wiki-reference/references/publishing.md",
    "skills/wiki-reference/references/repository-handoff.md",
    "skills/wiki-reference/references/resources-context.md",
    "skills/wiki-reference/references/surfaces-naming.md",
    "skills/wiki-semantic-enhance/SKILL.md",
    "skills/wiki-semantic-enhance/reference.md",
    "skills/wiki-sync/SKILL.md",
    "skills/wiki-sync/reference.md",
]

[tool.setuptools.data-files]
"share/doc/agent-wiki-cli" = ["docs/standalone-documentation.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that exercise large real repositories or helper toolchains",
    "network: tests or utilities that require live network access",
    "oci_integration: dedicated real-OCI qualification using public synthetic evidence",
]
