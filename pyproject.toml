[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-wiki-cli"
version = "0.3.40"
description = "CLI tool to maintain hybrid LLM Wikis for multi-language projects."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Denis Sivagin", email = "denissvgn@gmail.com"}
]
keywords = ["llm", "wiki", "documentation", "ai", "agents", "code-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
# TypeScript extraction requires Node.js + npm at runtime (no Python deps).
# Run: npm install in src/llm_wiki_cli/extractors/ts_scripts/
typescript = []
# Go extraction requires the Go toolchain at runtime (no Python deps).
go = []
# Rust extraction requires the Rust toolchain (cargo) at runtime (no Python deps).
rust = []
# MCP server support uses the official Python MCP SDK, which requires Python 3.10+.
mcp = ["mcp>=1.27,<2; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/Denissvgn/python-wiki-llm"
Repository = "https://github.com/Denissvgn/python-wiki-llm"
Issues = "https://github.com/Denissvgn/python-wiki-llm/issues"

[project.scripts]
llm-wiki = "llm_wiki_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_wiki_cli" = [
    "extractors/ts_scripts/package.json",
    "extractors/ts_scripts/extract.js",
    "extractors/go_scripts/main.go",
    "extractors/go_scripts/go.mod",
    "extractors/rust_scripts/Cargo.toml",
    "extractors/rust_scripts/Cargo.lock",
    "extractors/rust_scripts/src/main.rs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
