[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-cli"
version = "0.1.0"
description = "CLI tool to maintain hybrid LLM Wikis for Python projects."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Denis Sivagin", email = "denissvgn@users.noreply.github.com"}
]
keywords = ["llm", "wiki", "documentation", "ai", "agents", "code-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/Denissvgn/python-wiki-llm"
Repository = "https://github.com/Denissvgn/python-wiki-llm"
Issues = "https://github.com/Denissvgn/python-wiki-llm/issues"

[project.scripts]
llm-wiki = "llm_wiki_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
