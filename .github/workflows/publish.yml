name: Promote qualified artifacts to PyPI

on:
  workflow_dispatch:
    inputs:
      qualification-run-id:
        description: GitHub Actions run ID that produced qualified-release
        required: true
        type: string
      candidate-sha:
        description: Full Git SHA qualified by that run
        required: true
        type: string
      qualification-ref:
        description: Full branch ref used to dispatch qualification
        required: true
        type: string
      wheel-sha256:
        description: Qualified wheel SHA-256
        required: true
        type: string
      sdist-sha256:
        description: Qualified sdist SHA-256
        required: true
        type: string
      engine-wheel-sha256:
        description: Qualified llm-wiki-engine wheel SHA-256 (empty only for a CLI-only bundle)
        required: false
        default: ""
        type: string
      engine-sdist-sha256:
        description: Qualified llm-wiki-engine sdist SHA-256 (empty only for a CLI-only bundle)
        required: false
        default: ""
        type: string
      publish:
        description: Upload after verification (dry-run by default)
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-agent-wiki-cli-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify qualified promotion input
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ inputs.candidate-sha }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      QUALIFICATION_REF: ${{ inputs.qualification-ref }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification-run-id }}
      REPOSITORY: ${{ github.repository }}
      SDIST_SHA256: ${{ inputs.sdist-sha256 }}
      WHEEL_SHA256: ${{ inputs.wheel-sha256 }}
      ENGINE_SDIST_SHA256: ${{ inputs.engine-sdist-sha256 }}
      ENGINE_WHEEL_SHA256: ${{ inputs.engine-wheel-sha256 }}
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      wheel-filename: ${{ steps.verify.outputs.wheel-filename }}
      sdist-filename: ${{ steps.verify.outputs.sdist-filename }}
      engine-wheel-filename: ${{ steps.verify.outputs.engine-wheel-filename }}
      engine-sdist-filename: ${{ steps.verify.outputs.engine-sdist-filename }}
    steps:
      - name: Bind promotion to the protected default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "${WORKFLOW_EVENT}" = "workflow_dispatch"
          default_ref="refs/heads/${DEFAULT_BRANCH}"
          expected_workflow_ref="${REPOSITORY}/.github/workflows/publish.yml@${default_ref}"
          test "${RUN_REF}" = "${default_ref}"
          test "${WORKFLOW_REF}" = "${expected_workflow_ref}"
          test "${WORKFLOW_SHA}" = "${RUN_SHA}"
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format "${default_ref}"

      - name: Check out the trusted default-branch verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the qualification run before candidate checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -I trusted-verifier/release/qualification.py verify-workflow-run
          --repository "${REPOSITORY}"
          --workflow-run-id "${QUALIFICATION_RUN_ID}"
          --candidate-sha "${CANDIDATE_SHA}"
          --workflow-path .github/workflows/release-qualification.yml
          --workflow-name "Release qualification"
          --workflow-ref "${QUALIFICATION_REF}"
          --workflow-revision "${CANDIDATE_SHA}"
          --event workflow_dispatch
          --output workflow-run-verification.json

      - name: Download the immutable qualification bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: qualified-release
          path: qualified-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}

      - name: Check out the candidate for read-only identity verification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate-sha }}
          path: candidate-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify GitHub provenance and SPDX attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release-qualification.yml
        run: |
          set -euo pipefail
          : > build-provenance-attestations.jsonl
          : > sbom-attestations.jsonl
          for artifact in qualified-release/dist/*; do
            gh attestation verify "${artifact}" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${SIGNER_WORKFLOW}" \
              --signer-digest "${CANDIDATE_SHA}" \
              --source-digest "${CANDIDATE_SHA}" \
              --source-ref "${QUALIFICATION_REF}" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json | jq -c . >> build-provenance-attestations.jsonl
            gh attestation verify "${artifact}" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${SIGNER_WORKFLOW}" \
              --signer-digest "${CANDIDATE_SHA}" \
              --source-digest "${CANDIDATE_SHA}" \
              --source-ref "${QUALIFICATION_REF}" \
              --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --format json | jq -c . >> sbom-attestations.jsonl
          done
          # One receipt per qualified distribution file and predicate.
          expected="$(find qualified-release/dist -maxdepth 1 -type f | wc -l)"
          test "${expected}" -ge 2
          test "$(wc -l < build-provenance-attestations.jsonl)" -eq "${expected}"
          test "$(wc -l < sbom-attestations.jsonl)" -eq "${expected}"

      - name: Verify identity, gates, contents, and registry vacancy
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          tag_requirement=()
          if [[ "${PUBLISH_REQUESTED}" == "true" ]]; then
            tag_requirement=(--require-tag)
          fi
          engine_digests=()
          if [[ -n "${ENGINE_WHEEL_SHA256}${ENGINE_SDIST_SHA256}" ]]; then
            engine_digests=(
              --engine-wheel-sha256 "${ENGINE_WHEEL_SHA256}"
              --engine-sdist-sha256 "${ENGINE_SDIST_SHA256}"
            )
          fi
          python -I trusted-verifier/release/qualification.py verify-bundle \
            --bundle qualified-release \
            --repository "${REPOSITORY}" \
            --workflow-run-id "${QUALIFICATION_RUN_ID}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --wheel-sha256 "${WHEEL_SHA256}" \
            --sdist-sha256 "${SDIST_SHA256}" \
            "${engine_digests[@]}" \
            --repository-root candidate-source \
            --verify-repository \
            --check-registry \
            "${tag_requirement[@]}" \
            --output bundle-verification.json

      - name: Select verified attestations for the exact qualification attempt
        run: >-
          python -I trusted-verifier/release/qualification.py select-attestations
          --manifest qualified-release/qualification-manifest.json
          --workflow-verification workflow-run-verification.json
          --build-provenance build-provenance-attestations.jsonl
          --sbom-attestation sbom-attestations.jsonl
          --output selected-attestations

      - name: Emit the final technical release decision
        run: |
          tag_requirement=()
          if [[ "${PUBLISH_REQUESTED}" == "true" ]]; then
            tag_requirement=(--require-tag)
          fi
          python -I trusted-verifier/release/qualification.py finalize-promotion \
            --manifest qualified-release/qualification-manifest.json \
            --verification bundle-verification.json \
            --repository "${REPOSITORY}" \
            --workflow-run-id "${QUALIFICATION_RUN_ID}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --rd13-evidence "workflow-run=workflow-run-verification.json" \
            --rd13-evidence "build-provenance=selected-attestations/build-provenance-attestations.jsonl" \
            --rd13-evidence "sbom-attestation=selected-attestations/sbom-attestations.jsonl" \
            "${tag_requirement[@]}" \
            --output promotion-decision.json

      - name: Preserve final promotion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: promotion-decision
          path: |
            promotion-decision.json
            workflow-run-verification.json
            bundle-verification.json
            build-provenance-attestations.jsonl
            sbom-attestations.jsonl
            selected-attestations/
          if-no-files-found: error
          retention-days: 14

      - name: Record dry-run result
        if: ${{ !inputs.publish }}
        env:
          VERIFIED_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          {
            printf '%s\n' "## Qualified promotion dry-run"
            printf '\n'
            printf "Verified \`%s\` without uploading.\n" "${VERIFIED_TAG}"
            printf '\n'
            printf '%s\n' "- qualification run: \`${QUALIFICATION_RUN_ID}\`"
            printf '%s\n' "- candidate: \`${CANDIDATE_SHA}\`"
            printf '%s\n' "- wheel: \`${WHEEL_SHA256}\`"
            printf '%s\n' "- sdist: \`${SDIST_SHA256}\`"
            printf '%s\n' "- engine wheel: \`${ENGINE_WHEEL_SHA256:-none}\`"
            printf '%s\n' "- engine sdist: \`${ENGINE_SDIST_SHA256:-none}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish the already-qualified distributions
    if: ${{ inputs.publish && needs.verify.result == 'success' }}
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/agent-wiki-cli/${{ needs.verify.outputs.version }}/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download the exact verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: qualified-release
          path: qualified-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}

      - name: Split the engine from the CLI it pins
        id: split
        run: |
          set -euo pipefail
          mkdir -p upload/engine upload/cli
          shopt -s nullglob
          engine=(qualified-release/dist/llm_wiki_engine-*)
          cli=(qualified-release/dist/agent_wiki_cli-*)
          test "${#cli[@]}" -eq 2
          test "${#engine[@]}" -eq 0 || test "${#engine[@]}" -eq 2
          test $(( ${#cli[@]} + ${#engine[@]} )) -eq "$(find qualified-release/dist -maxdepth 1 -type f | wc -l)"
          if (( ${#engine[@]} )); then cp "${engine[@]}" upload/engine/; fi
          cp "${cli[@]}" upload/cli/
          echo "engine=$(( ${#engine[@]} > 0 ))" >> "${GITHUB_OUTPUT}"

      # The CLI pins this exact engine, so the engine must be on PyPI first.
      - name: Publish the engine to PyPI using Trusted Publishing
        if: ${{ steps.split.outputs.engine == '1' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/engine/
          attestations: true

      - name: Publish the CLI to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/cli/
          attestations: true
