name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - edited
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  activation-proof:
    name: Release activation proof
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out the trusted base verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verifier Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Create verifier environment
        run: '"${{ steps.python.outputs.python-path }}" -m venv .venv'
      - name: Verify activation-only proposals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          PROPOSED_HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -f release/qualification_automation.py ]]; then
            .venv/bin/python -I release/qualification_automation.py inspect \
              --root . --repository "${GITHUB_REPOSITORY}" \
              --candidate-sha "${CANDIDATE_SHA}" --output activation-readiness.json
          fi
          if [[ "${EVENT}" == "pull_request" && -f release/qualification_automation.py ]]; then
            .venv/bin/python -I release/qualification_automation.py validate-pr \
              --root . --repository "${GITHUB_REPOSITORY}" \
              --pull-request "${PULL_REQUEST}" --head-sha "${PROPOSED_HEAD}" \
              --output activation-proof.json
          else
            echo 'Trusted verifier bootstrap or main CI; no activation PR was accepted.'
          fi

  plan:
    name: Select affected PR contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      plan-sha256: ${{ steps.select.outputs.plan-sha256 }}
      policy-sha256: ${{ steps.select.outputs.policy-sha256 }}
      has-tests: ${{ steps.select.outputs.has-tests }}
      matrix: ${{ steps.select.outputs.matrix }}
      typecheck: ${{ steps.select.outputs.typecheck }}
      mcp-sdk: ${{ steps.select.outputs.mcp-sdk }}
      p0-oci-integration: ${{ steps.select.outputs.p0-oci-integration }}
      action: ${{ steps.select.outputs.action }}
      dependency-controls: ${{ steps.select.outputs.dependency-controls }}
      package: ${{ steps.select.outputs.package }}
      core-check-inputs: ${{ steps.select.outputs.core-check-inputs }}
      core-check-comparison: ${{ steps.select.outputs.core-check-comparison }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      id: python
      with:
        python-version: '3.13'
    - name: Create planner environment
      run: '"${{ steps.python.outputs.python-path }}" -m venv .venv'
    - name: Load only the trusted base selection policy
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/pr-ci"
        for name in pr_ci.py pr_ci_pytest.py pr-ci-policy.json skip-allowlist.json hosted_evidence.py qualification.py toolchain-lock.json; do
          if ! git cat-file -e "${BASE_SHA}:release/${name}"; then
            echo "::error::Trusted base selection policy is missing. Land the reviewed policy bootstrap first; candidate policy is never executed as a fallback."
            exit 2
          fi
          git show "${BASE_SHA}:release/${name}" > "${RUNNER_TEMP}/pr-ci/${name}"
        done
        .venv/bin/python -I - "${RUNNER_TEMP}/pr-ci/pr-ci-policy.json" <<'PY'
        import json, pathlib, sys
        registry = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
        if type(registry.get("revision")) is not int or registry["revision"] != 1:
            raise SystemExit("Trusted base policy revision is not admitted; review the complete bootstrap first")
        PY
    - name: Bind selected checks to this exact candidate
      id: select
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        .venv/bin/python -I "${RUNNER_TEMP}/pr-ci/pr_ci.py" plan \
          --root . --event "${GITHUB_EVENT_PATH}" --candidate "${GITHUB_SHA}" \
          --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" \
          --attempt "${GITHUB_RUN_ATTEMPT}" --output "${RUNNER_TEMP}/pr-ci/plan.json"
    - name: Retain authenticated selection inputs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        archive: true
        name: pr-ci-plan-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr-ci/
        if-no-files-found: error
        retention-days: 14
  typecheck:
    name: Python type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up qualification Python
      id: python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Check shared local and hosted producer contracts
      run: python -I release/preflight_contracts.py check --repo .
    - name: Install release typing dependencies
      run: |
        python -m pip install ".[dev,mcp,tokens]"
        python -m pip install --require-hashes --only-binary=:all: -r examples/fastapi-contracts/requirements-ci.txt
        python -m pip install --require-hashes -r release/requirements.txt
    - name: Check the complete project type surface
      shell: bash
      run: '"${{ steps.python.outputs.python-path }}" -m pyright --pythonpath "${{ steps.python.outputs.python-path
        }}" | tee pyright.log'
    - name: Check the release lint scope
      shell: bash
      run: '"${{ steps.python.outputs.python-path }}" -m ruff check src tests examples integrations/github-action/render_summary.py
        release/preflight.py release/preflight_contracts.py release/preflight_runner.py release/pr_ci.py release/pr_ci_pytest.py
        | tee ruff.log'
    - name: Upload typing diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        archive: true
        name: python-typecheck-${{ github.run_attempt }}
        path: |+
          pyright.log
          ruff.log

        if-no-files-found: warn
        retention-days: 14
    needs: plan
    if: ${{ needs.plan.outputs.typecheck == 'true' }}
  test:
    name: Selected tests (${{ matrix.lane }})
    needs: plan
    if: ${{ needs.plan.outputs.has-tests == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      LLM_WIKI_REQUIRE_NATIVE_DIAGNOSTICS: ${{ (matrix.lane == 'toolchains' || matrix.typescript) && '1' || '' }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: pr-ci-plan-${{ github.run_attempt }}
        path: incoming/pr-ci
        digest-mismatch: error
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      id: python
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Create isolated candidate environment
      run: |
        "${{ steps.python.outputs.python-path }}" -m venv .venv
        if [[ "${RUNNER_OS}" == Windows ]]; then
          echo "PR_CI_PYTHON=${PWD}/.venv/Scripts/python.exe" >> "${GITHUB_ENV}"
        else
          echo "PR_CI_PYTHON=${PWD}/.venv/bin/python" >> "${GITHUB_ENV}"
        fi
        echo "LLM_WIKI_CACHE_DIR=${RUNNER_TEMP}/pr-ci-helpers" >> "${GITHUB_ENV}"
    - name: Install exact candidate noneditably
      env:
        PR_CI_PROFILE: ${{ matrix.profile }}
      run: '"${PR_CI_PYTHON}" -m pip install ".[${PR_CI_PROFILE}]"'
    - name: Set up selected Node runtime
      if: ${{ matrix.typescript }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: false
    - name: Set up selected Go runtime
      if: ${{ matrix.go }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ matrix.go-version }}
        cache: false
    - name: Install selected locked rust compiler
      if: ${{ matrix.rust }}
      run: |
        set -euo pipefail
        test "${RUNNER_OS}" = Linux
        test "$(uname -m)" = x86_64
        "${PR_CI_PYTHON}" -I incoming/pr-ci/qualification.py verify-download \
          --lock incoming/pr-ci/toolchain-lock.json --key toolchains.rust.artifact --output "${RUNNER_TEMP}/pr-rust.tar.xz"
        mkdir -p "${RUNNER_TEMP}/pr-rust-source" "${RUNNER_TEMP}/pr-rust"
        tar -xJf "${RUNNER_TEMP}/pr-rust.tar.xz" -C "${RUNNER_TEMP}/pr-rust-source" --strip-components=1
        "${RUNNER_TEMP}/pr-rust-source/install.sh" --prefix="${RUNNER_TEMP}/pr-rust" --disable-ldconfig
        echo "${RUNNER_TEMP}/pr-rust/bin" >> "${GITHUB_PATH}"
    - name: Install selected locked haskell compiler
      if: ${{ matrix.haskell }}
      run: |
        set -euo pipefail
        test "${RUNNER_OS}" = Linux
        test "$(uname -m)" = x86_64
        "${PR_CI_PYTHON}" -I incoming/pr-ci/qualification.py verify-download \
          --lock incoming/pr-ci/toolchain-lock.json --key toolchains.haskell.artifact --output "${RUNNER_TEMP}/pr-ghc.tar.xz"
        mkdir -p "${RUNNER_TEMP}/pr-ghc-source" "${RUNNER_TEMP}/pr-ghc"
        tar -xJf "${RUNNER_TEMP}/pr-ghc.tar.xz" -C "${RUNNER_TEMP}/pr-ghc-source" --strip-components=1
        (cd "${RUNNER_TEMP}/pr-ghc-source" && ./configure --prefix="${RUNNER_TEMP}/pr-ghc" && make install)
        echo "${RUNNER_TEMP}/pr-ghc/bin" >> "${GITHUB_PATH}"
    - name: Prepare only selected helper languages
      env:
        PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
        BASE_POLICY_SHA256: ${{ needs.plan.outputs.policy-sha256 }}
        SELECTED_LANE: ${{ matrix.lane }}
      run: |
        "${PR_CI_PYTHON}" -I - <<'PY'
        import hashlib, json, os, pathlib
        root = pathlib.Path("incoming/pr-ci")
        names = ("pr_ci.py", "pr_ci_pytest.py", "pr-ci-policy.json", "skip-allowlist.json", "hosted_evidence.py", "qualification.py", "toolchain-lock.json")
        files = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names}
        identity = hashlib.sha256(json.dumps(files, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
        if identity != os.environ["BASE_POLICY_SHA256"] or hashlib.sha256((root / "plan.json").read_bytes()).hexdigest() != os.environ["PLAN_SHA256"]:
            raise SystemExit("Base-owned selection driver or plan digest differs")
        PY
        "${PR_CI_PYTHON}" -I incoming/pr-ci/pr_ci.py prepare --root . \
          --plan incoming/pr-ci/plan.json --expected-sha256 "${PLAN_SHA256}" \
          --lane "${SELECTED_LANE}" --cache "${LLM_WIKI_CACHE_DIR}"
    - name: Run and account for every selected case
      env:
        PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
        BASE_POLICY_SHA256: ${{ needs.plan.outputs.policy-sha256 }}
        SELECTED_LANE: ${{ matrix.lane }}
      run: |
        "${PR_CI_PYTHON}" -I - <<'PY'
        import hashlib, json, os, pathlib
        root = pathlib.Path("incoming/pr-ci")
        names = ("pr_ci.py", "pr_ci_pytest.py", "pr-ci-policy.json", "skip-allowlist.json", "hosted_evidence.py", "qualification.py", "toolchain-lock.json")
        files = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names}
        identity = hashlib.sha256(json.dumps(files, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
        if identity != os.environ["BASE_POLICY_SHA256"] or hashlib.sha256((root / "plan.json").read_bytes()).hexdigest() != os.environ["PLAN_SHA256"]:
            raise SystemExit("Base-owned selection driver or plan digest differs")
        PY
        "${PR_CI_PYTHON}" -I incoming/pr-ci/pr_ci.py run --root . \
          --plan incoming/pr-ci/plan.json --expected-sha256 "${PLAN_SHA256}" \
          --lane "${SELECTED_LANE}" --output "${RUNNER_TEMP}/pr-ci-evidence"
    - name: Retain selected case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        archive: true
        name: pr-ci-tests-${{ matrix.lane }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr-ci-evidence/
        if-no-files-found: error
        retention-days: 14
  mcp-sdk:
    name: mcp-sdk (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: mcp-3.10
          python-version: '3.10'
        - lane: mcp-3.13
          python-version: '3.13'
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies with the MCP SDK
      run: python -m pip install -e ".[dev,mcp]"
    - name: Run MCP SDK registration contract
      env:
        LLM_WIKI_REQUIRE_MCP_SDK: '1'
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
      run: python -m pytest tests/test_mcp_sdk.py tests/test_workflow_interfaces.py::test_real_sdk_preserves_single_counted_representation
        -q tests/test_compact_delivery_interfaces.py::test_actual_mcp_sdk_content_carries_view_then_receipt_as_separate_transport
        tests/test_developer_value_combined_interfaces.py::test_actual_sdk_combined_callers_compact_and_stale_custody
        tests/test_task_compact_readable.py::test_actual_mcp_v2_metadata_toggle_keeps_qualifications_and_receipts
        tests/test_owned_packet_recovery.py::test_registered_sdk_keeps_structured_authority_failure -p no:cacheprovider
        --strict-config --strict-markers -W error -o xfail_strict=true --junitxml="junit-${{ matrix.lane }}.xml"
    - name: Enforce MCP SDK registration and canonical delivery
      run: python -I release/qualification.py verify-junit --junit "junit-${{ matrix.lane }}.xml" --lane "${{ matrix.lane
        }}" --allowlist release/skip-allowlist.json --minimum-collected 8 --minimum-passed 8 --output "result-${{
        matrix.lane }}.json"
    - name: Upload failed MCP diagnostics
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        archive: true
        name: ci-diagnostics-${{ matrix.lane }}-${{ github.run_attempt }}
        path: |
          junit-${{ matrix.lane }}.xml
          result-${{ matrix.lane }}.json
        if-no-files-found: warn
        retention-days: 14
    needs: plan
    if: ${{ needs.plan.outputs.mcp-sdk == 'true' }}
  wiki-integrity:
    name: LLM Wiki integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      PIP_NO_INPUT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out the candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check LLM Wiki integrity
        uses: ./integrations/wiki-integrity
        with:
          src-dir: .
          wiki-dir: docs/llm_wiki
          report-schema: v4
          comparison-policy: analysis-v1
          maintenance-candidate-sha: ${{ github.sha }}

  p0-oci-integration:
    name: P0 synthetic OCI isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install focused test dependencies
      run: python -m pip install -e ".[dev]"
    - name: Build digest-pinned public synthetic OCI fixture
      shell: bash
      run: |
        set -euo pipefail

        docker version
        python_base_tag="python:3.13-alpine"
        registry_tag="registry:2"
        fixture_tag="localhost:5000/llm-wiki/p0-oci-fixture:ci"
        registry_name="llm-wiki-p0-oci-registry"

        # One immutable public image carries separate fixed worker/probe modes,
        # reducing the qualification supply chain without sharing role outputs.
        docker pull "${python_base_tag}"
        python_base_ref="$(docker image inspect \
          --format='{{index .RepoDigests 0}}' "${python_base_tag}")"
        case "${python_base_ref}" in
          *@sha256:*) ;;
          *) echo "Python fixture base is not digest pinned." >&2; exit 1 ;;
        esac

        docker pull "${registry_tag}"
        registry_ref="$(docker image inspect \
          --format='{{index .RepoDigests 0}}' "${registry_tag}")"
        case "${registry_ref}" in
          *@sha256:*) ;;
          *) echo "Local registry image is not digest pinned." >&2; exit 1 ;;
        esac

        cleanup_registry() {
          docker rm --force "${registry_name}" >/dev/null 2>&1 || true
        }
        trap cleanup_registry EXIT
        docker run --detach \
          --publish 127.0.0.1:5000:5000 \
          --name "${registry_name}" \
          "${registry_ref}"

        docker build \
          --network=none \
          --pull=false \
          --build-arg "BASE_IMAGE=${python_base_ref}" \
          --tag "${fixture_tag}" \
          tests/fixtures/oci_calibration
        docker push "${fixture_tag}"
        docker pull "${fixture_tag}"
        fixture_ref="$(docker image inspect \
          --format='{{index .RepoDigests 0}}' "${fixture_tag}")"
        case "${fixture_ref}" in
          localhost:5000/llm-wiki/p0-oci-fixture@sha256:*) ;;
          *) echo "Synthetic OCI fixture is not digest pinned." >&2; exit 1 ;;
        esac

        cleanup_registry
        trap - EXIT

        docker_executable="$(readlink -f "$(command -v docker)")"
        {
          echo "LLM_WIKI_OCI_DOCKER=${docker_executable}"
          echo "LLM_WIKI_OCI_TEST_IMAGE=${fixture_ref}"
        } >> "${GITHUB_ENV}"
    - name: Run real no-egress broker qualification
      env:
        LLM_WIKI_RUN_OCI_INTEGRATION: '1'
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
      run: python -m pytest tests/test_documentation_calibration_oci_integration.py -m oci_integration -v
    needs: plan
    if: ${{ needs.plan.outputs.p0-oci-integration == 'true' }}
  action:
    needs: plan
    if: ${{ needs.plan.outputs.action == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/action-selftest.yml
  dependency-controls:
    needs: plan
    if: ${{ needs.plan.outputs.dependency-controls == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-setup-check.yml
  package:
    name: Selected package build and schema
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up package Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: python -m pip install -e ".[dev,tokens]"
    - name: Check package builds
      run: |
        python -m pip install "build==1.5.0"
        python -m build
        python tests/verify_installed_knowledge_schema.py dist
  core-check-inputs:
    name: Freeze core-check comparison inputs
    if: ${{ needs.plan.outputs.core-check-inputs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.changes.outputs.enabled }}
      inputs-sha256: ${{ steps.freeze.outputs.inputs-sha256 }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Use the trusted affected-contract decision
      id: changes
      env:
        BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
      run: echo "enabled=true" >> "${GITHUB_OUTPUT}"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      if: ${{ steps.changes.outputs.enabled == 'true' }}
      with:
        python-version: '3.13'
    - name: Freeze baseline policies and candidate inputs
      id: freeze
      if: ${{ steps.changes.outputs.enabled == 'true' }}
      env:
        BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
      run: python -I release/core_check_performance.py freeze --baseline "${BASELINE_SHA}" --candidate "${GITHUB_SHA}"
        --output core-check-inputs
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ steps.changes.outputs.enabled == 'true' }}
      with:
        archive: true
        name: core-check-inputs
        path: core-check-inputs/
        compression-level: 0
        if-no-files-found: error
        retention-days: 14
    needs: plan
  core-check-comparison:
    name: Core-check comparison (${{ matrix.lane }})
    needs:
    - plan
    - core-check-inputs
    if: ${{ needs.plan.outputs.core-check-comparison == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
        - lane: ubuntu-3.10
          os: ubuntu-24.04
          python: '3.10'
          coverage: true
        - lane: windows-3.13
          os: windows-2025
          python: '3.13'
          coverage: false
        - lane: macos-3.14
          os: macos-15
          python: '3.14'
          coverage: false
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        digest-mismatch: error
        name: core-check-inputs
        path: incoming
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}
    - name: Verify the frozen helper before execution
      env:
        INPUTS_SHA256: ${{ needs.core-check-inputs.outputs.inputs-sha256 }}
      run: |
        python -I -c 'import hashlib, json, pathlib, sys; root = pathlib.Path(sys.argv[1]); raw = (root / "inputs.json").read_bytes(); assert hashlib.sha256(raw).hexdigest() == sys.argv[2], "input manifest digest mismatch"; manifest = json.loads(raw); assert hashlib.sha256((root / "core_check_performance.py").read_bytes()).hexdigest() == manifest["files"]["core_check_performance.py"], "helper digest mismatch"' incoming "${INPUTS_SHA256}"
        python -I incoming/core_check_performance.py prepare \
          --inputs incoming --inputs-sha256 "${INPUTS_SHA256}" --work work
        python -m venv .venv
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          echo "CORE_PYTHON=${PWD}/.venv/Scripts/python.exe" >> "${GITHUB_ENV}"
        else
          echo "CORE_PYTHON=${PWD}/.venv/bin/python" >> "${GITHUB_ENV}"
        fi
    - name: Install the candidate profile noneditably
      run: '"${CORE_PYTHON}" -m pip install --no-cache-dir "./work/candidate[dev,tokens]"'
    - name: Run affected assertions and mutation controls
      working-directory: work/candidate
      env:
        LLM_WIKI_QUALIFICATION_SOURCE_ARCHIVE: ${{ github.workspace }}/incoming/candidate-source.tar
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
      run: '"${CORE_PYTHON}" -m pytest tests/test_architecture_layers.py tests/test_static_quality_architecture.py
        tests/test_python_source_inventory.py tests/test_public_docs_vocabulary.py tests/test_public_docs_performance.py
        tests/test_core_check_performance.py -q -p no:cacheprovider --strict-config --strict-markers -W error -o
        xfail_strict=true --junitxml=../../core-check-controls.xml'
    - name: Compare policies on identical candidate inputs
      env:
        INPUTS_SHA256: ${{ needs.core-check-inputs.outputs.inputs-sha256 }}
        COVERAGE: ${{ matrix.coverage }}
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
      run: |
        coverage=()
        if [[ "${COVERAGE}" == "true" ]]; then coverage=(--coverage); fi
        "${CORE_PYTHON}" -I incoming/core_check_performance.py compare \
          --inputs incoming --inputs-sha256 "${INPUTS_SHA256}" \
          --work work --output comparison --samples 2 "${coverage[@]}"
    - name: Retain comparison and failure evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        archive: true
        name: core-check-comparison-${{ matrix.lane }}
        path: |
          comparison/
          core-check-controls.xml
        if-no-files-found: warn
        retention-days: 14
  complete:
    name: CI complete
    if: always()
    needs:
    - activation-proof
    - plan
    - typecheck
    - test
    - mcp-sdk
    - wiki-integrity
    - p0-oci-integration
    - action
    - dependency-controls
    - package
    - core-check-inputs
    - core-check-comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      id: python
      with:
        python-version: '3.13'
    - name: Create gate environment
      run: '"${{ steps.python.outputs.python-path }}" -m venv .venv'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: pr-ci-plan-${{ github.run_attempt }}
        path: incoming/pr-ci
        digest-mismatch: error
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      if: ${{ needs.plan.outputs.has-tests == 'true' }}
      with:
        pattern: pr-ci-tests-*-${{ github.run_attempt }}
        path: incoming/tests
        digest-mismatch: error
    - name: Require every selected producer and exact case owner
      env:
        PRODUCERS: ${{ toJSON(needs) }}
        PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
        BASE_POLICY_SHA256: ${{ needs.plan.outputs.policy-sha256 }}
        PR_CI_PYTHON: .venv/bin/python
      run: |
        "${PR_CI_PYTHON}" -I - <<'PY'
        import hashlib, json, os, pathlib
        root = pathlib.Path("incoming/pr-ci")
        names = ("pr_ci.py", "pr_ci_pytest.py", "pr-ci-policy.json", "skip-allowlist.json", "hosted_evidence.py", "qualification.py", "toolchain-lock.json")
        files = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names}
        identity = hashlib.sha256(json.dumps(files, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
        if identity != os.environ["BASE_POLICY_SHA256"] or hashlib.sha256((root / "plan.json").read_bytes()).hexdigest() != os.environ["PLAN_SHA256"]:
            raise SystemExit("Base-owned selection driver or plan digest differs")
        PY
        set -euo pipefail
        mkdir -p complete
        .venv/bin/python -I - <<'PY'
        import os, pathlib
        pathlib.Path("producers.json").write_text(os.environ["PRODUCERS"], encoding="utf-8")
        PY
        .venv/bin/python -I incoming/pr-ci/pr_ci.py gate \
          --plan incoming/pr-ci/plan.json --expected-sha256 "${PLAN_SHA256}" \
          --needs producers.json --reports incoming/tests --output complete/complete.json
        cp incoming/pr-ci/plan.json complete/plan.json
    - name: Retain nonqualifying aggregate
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        archive: true
        name: pr-ci-complete-${{ github.run_attempt }}
        path: complete/
        if-no-files-found: error
        retention-days: 90
