name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: windows-2025
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m pytest tests/ -v --cov=llm_wiki_cli --cov-report=term-missing

      - name: Check package builds
        run: |
          python -m pip install --no-cache-dir "build==1.5.0"
          python -m build
          python tests/verify_installed_knowledge_schema.py dist

  mcp-sdk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with the MCP SDK
        run: python -m pip install --no-cache-dir -e ".[dev,mcp]"

      - name: Run MCP SDK tests
        env:
          LLM_WIKI_REQUIRE_MCP_SDK: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m pytest tests/test_mcp.py -v

  wiki-integrity:
    name: LLM Wiki integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "true"
      PIP_NO_INPUT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out the candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install the candidate package
        run: >-
          "${{ steps.setup-python.outputs.python-path }}"
          -I -m pip install --no-cache-dir .

      - name: Bind runner-temporary wiki paths
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/llm-wiki-cache"
          evidence_dir="${RUNNER_TEMP}/llm-wiki-evidence"
          occupied=false
          for reserved_dir in "${cache_dir}" "${evidence_dir}"; do
            if [[ -e "${reserved_dir}" || -L "${reserved_dir}" ]]; then
              occupied=true
              printf 'Runner-temporary path is already occupied: %s\n' \
                "${reserved_dir}" >&2
            fi
          done
          if ${occupied}; then
            quarantine_dir="$(
              /usr/bin/mktemp -d "${RUNNER_TEMP}/llm-wiki-collisions.XXXXXX"
            )"
            for reserved_dir in "${cache_dir}" "${evidence_dir}"; do
              if [[ -e "${reserved_dir}" || -L "${reserved_dir}" ]]; then
                leaf="${reserved_dir##*/}"
                if ! /bin/mv -- \
                  "${reserved_dir}" "${quarantine_dir}/${leaf}"; then
                  /bin/rm -rf -- "${reserved_dir}"
                fi
                [[ ! -e "${reserved_dir}" && ! -L "${reserved_dir}" ]]
              fi
            done
            exit 1
          fi
          for reserved_dir in "${cache_dir}" "${evidence_dir}"; do
            mkdir -- "${reserved_dir}"
            [[ -d "${reserved_dir}" && ! -L "${reserved_dir}" ]]
          done
          {
            printf 'LLM_WIKI_CACHE_DIR=%s\n' "${cache_dir}"
            printf 'LLM_WIKI_EVIDENCE_DIR=%s\n' "${evidence_dir}"
          } >> "${GITHUB_ENV}"

      - name: Install the locked routine toolchain
        shell: bash
        run: >-
          .github/scripts/setup-llm-wiki-ci-toolchains.sh
          --mode routine
          --install-root "${RUNNER_TEMP}/llm-wiki-toolchains"
          --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Record locked routine toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p -- "${LLM_WIKI_EVIDENCE_DIR}"

          expected_node="$(
            "${{ steps.setup-python.outputs.python-path }}" \
              -I release/qualification.py lock-value \
              --lock release/toolchain-lock.json \
              --key toolchains.node.version_output
          )"
          expected_npm="$(
            "${{ steps.setup-python.outputs.python-path }}" \
              -I release/qualification.py lock-value \
              --lock release/toolchain-lock.json \
              --key toolchains.npm.version_output
          )"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"

          {
            printf 'node expected: %s\n' "${expected_node}"
            printf 'node actual: %s\n' "${actual_node}"
            printf 'npm expected: %s\n' "${expected_npm}"
            printf 'npm actual: %s\n' "${actual_npm}"
          } | tee "${LLM_WIKI_EVIDENCE_DIR}/locked-toolchain-versions.txt"

          test "${actual_node}" = "${expected_node}"
          test "${actual_npm}" = "${expected_npm}"

      - name: Prepare the automatically selected extractor helpers
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.setup-python.outputs.python-path }}" \
            -I -m llm_wiki_cli.cli prepare-extractors \
            --src-dir . \
            --cache-dir "${LLM_WIKI_CACHE_DIR}" \
            2>&1 | tee "${LLM_WIKI_EVIDENCE_DIR}/prepare-extractors.log"

      - name: Validate committed wiki (native drift diagnostics are advisory)
        shell: bash
        run: >-
          .github/scripts/run-llm-wiki-ci-check.sh
          --python "${{ steps.setup-python.outputs.python-path }}"
          --src-dir .
          --wiki-dir docs/llm_wiki
          --helper-cache-dir "${LLM_WIKI_CACHE_DIR}"
          --report-dir "${LLM_WIKI_EVIDENCE_DIR}"
          --jobs 1
          --knowledge-drift-report

      - name: Upload bounded wiki integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llm-wiki-ci-${{ github.sha }}
          path: |
            ${{ runner.temp }}/llm-wiki-evidence/llm-wiki-ci-report.md
            ${{ runner.temp }}/llm-wiki-evidence/llm-wiki-ci-report.json
            ${{ runner.temp }}/llm-wiki-evidence/llm-wiki-ci-report.invalid.txt
            ${{ runner.temp }}/llm-wiki-evidence/prepare-extractors.log
            ${{ runner.temp }}/llm-wiki-evidence/locked-toolchain-versions.txt
          retention-days: 14
          if-no-files-found: warn

  p0-oci-integration:
    name: P0 synthetic OCI isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install focused test dependencies
        run: python -m pip install --no-cache-dir -e ".[dev]"

      - name: Build digest-pinned public synthetic OCI fixture
        shell: bash
        run: |
          set -euo pipefail

          docker version
          python_base_tag="python:3.13-alpine"
          registry_tag="registry:2"
          fixture_tag="localhost:5000/llm-wiki/p0-oci-fixture:ci"
          registry_name="llm-wiki-p0-oci-registry"

          # One immutable public image carries separate fixed worker/probe modes,
          # reducing the qualification supply chain without sharing role outputs.
          docker pull "${python_base_tag}"
          python_base_ref="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "${python_base_tag}")"
          case "${python_base_ref}" in
            *@sha256:*) ;;
            *) echo "Python fixture base is not digest pinned." >&2; exit 1 ;;
          esac

          docker pull "${registry_tag}"
          registry_ref="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "${registry_tag}")"
          case "${registry_ref}" in
            *@sha256:*) ;;
            *) echo "Local registry image is not digest pinned." >&2; exit 1 ;;
          esac

          cleanup_registry() {
            docker rm --force "${registry_name}" >/dev/null 2>&1 || true
          }
          trap cleanup_registry EXIT
          docker run --detach \
            --publish 127.0.0.1:5000:5000 \
            --name "${registry_name}" \
            "${registry_ref}"

          docker build \
            --network=none \
            --pull=false \
            --build-arg "BASE_IMAGE=${python_base_ref}" \
            --tag "${fixture_tag}" \
            tests/fixtures/oci_calibration
          docker push "${fixture_tag}"
          docker pull "${fixture_tag}"
          fixture_ref="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "${fixture_tag}")"
          case "${fixture_ref}" in
            localhost:5000/llm-wiki/p0-oci-fixture@sha256:*) ;;
            *) echo "Synthetic OCI fixture is not digest pinned." >&2; exit 1 ;;
          esac

          cleanup_registry
          trap - EXIT

          docker_executable="$(readlink -f "$(command -v docker)")"
          {
            echo "LLM_WIKI_OCI_DOCKER=${docker_executable}"
            echo "LLM_WIKI_OCI_TEST_IMAGE=${fixture_ref}"
          } >> "${GITHUB_ENV}"

      - name: Run real no-egress broker qualification
        env:
          LLM_WIKI_RUN_OCI_INTEGRATION: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: >-
          python -m pytest
          tests/test_documentation_calibration_oci_integration.py
          -m oci_integration
          -v
