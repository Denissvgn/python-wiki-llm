name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core-ubuntu-3.10
            os: ubuntu-24.04
            python-version: "3.10"
            coverage: true
            package: true
          - lane: core-windows-3.13
            os: windows-2025
            python-version: "3.13"
            coverage: false
            package: false
          - lane: core-macos-3.14
            os: macos-15
            python-version: "3.14"
            coverage: false
            package: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run strict suite with coverage
        if: ${{ matrix.coverage }}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: >-
          python -m pytest tests -q
          -p no:cacheprovider
          --strict-config
          --strict-markers
          -W error
          -o xfail_strict=true
          --junitxml="junit-${{ matrix.lane }}.xml"
          --cov=llm_wiki_cli
          --cov-report=term-missing
          --cov-fail-under=87

      - name: Run strict suite
        if: ${{ !matrix.coverage }}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: >-
          python -m pytest tests -q
          -p no:cacheprovider
          --strict-config
          --strict-markers
          -W error
          -o xfail_strict=true
          --junitxml="junit-${{ matrix.lane }}.xml"

      - name: Enforce exact skips and minimum inventory
        run: >-
          python -I release/qualification.py verify-junit
          --junit "junit-${{ matrix.lane }}.xml"
          --lane "${{ matrix.lane }}"
          --allowlist release/skip-allowlist.json
          --minimum-collected 5322
          --minimum-passed 5070
          --output "result-${{ matrix.lane }}.json"

      - name: Check package builds
        if: ${{ matrix.package }}
        run: |
          python -m pip install "build==1.5.0"
          python -m build
          python tests/verify_installed_knowledge_schema.py dist

      - name: Upload failed lane diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            junit-${{ matrix.lane }}.xml
            result-${{ matrix.lane }}.json
          if-no-files-found: warn
          retention-days: 14

  mcp-sdk:
    name: mcp-sdk (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: mcp-3.10
            python-version: "3.10"
          - lane: mcp-3.13
            python-version: "3.13"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies with the MCP SDK
        run: python -m pip install -e ".[dev,mcp]"

      - name: Run MCP SDK registration contract
        env:
          LLM_WIKI_REQUIRE_MCP_SDK: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: >-
          python -m pytest tests/test_mcp_sdk.py -q
          -p no:cacheprovider
          --strict-config
          --strict-markers
          -W error
          -o xfail_strict=true
          --junitxml="junit-${{ matrix.lane }}.xml"

      - name: Enforce the single MCP SDK registration contract
        run: >-
          python -I release/qualification.py verify-junit
          --junit "junit-${{ matrix.lane }}.xml"
          --lane "${{ matrix.lane }}"
          --allowlist release/skip-allowlist.json
          --minimum-collected 1
          --minimum-passed 1
          --output "result-${{ matrix.lane }}.json"

      - name: Upload failed MCP diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            junit-${{ matrix.lane }}.xml
            result-${{ matrix.lane }}.json
          if-no-files-found: warn
          retention-days: 14

  wiki-integrity:
    name: LLM Wiki integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      PIP_NO_INPUT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out the candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check LLM Wiki integrity
        uses: ./integrations/wiki-integrity
        with:
          src-dir: .
          wiki-dir: docs/llm_wiki

  p0-oci-integration:
    name: P0 synthetic OCI isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install focused test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build digest-pinned public synthetic OCI fixture
        shell: bash
        run: |
          set -euo pipefail

          docker version
          python_base_tag="python:3.13-alpine"
          registry_tag="registry:2"
          fixture_tag="localhost:5000/llm-wiki/p0-oci-fixture:ci"
          registry_name="llm-wiki-p0-oci-registry"

          # One immutable public image carries separate fixed worker/probe modes,
          # reducing the qualification supply chain without sharing role outputs.
          docker pull "${python_base_tag}"
          python_base_ref="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "${python_base_tag}")"
          case "${python_base_ref}" in
            *@sha256:*) ;;
            *) echo "Python fixture base is not digest pinned." >&2; exit 1 ;;
          esac

          docker pull "${registry_tag}"
          registry_ref="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "${registry_tag}")"
          case "${registry_ref}" in
            *@sha256:*) ;;
            *) echo "Local registry image is not digest pinned." >&2; exit 1 ;;
          esac

          cleanup_registry() {
            docker rm --force "${registry_name}" >/dev/null 2>&1 || true
          }
          trap cleanup_registry EXIT
          docker run --detach \
            --publish 127.0.0.1:5000:5000 \
            --name "${registry_name}" \
            "${registry_ref}"

          docker build \
            --network=none \
            --pull=false \
            --build-arg "BASE_IMAGE=${python_base_ref}" \
            --tag "${fixture_tag}" \
            tests/fixtures/oci_calibration
          docker push "${fixture_tag}"
          docker pull "${fixture_tag}"
          fixture_ref="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "${fixture_tag}")"
          case "${fixture_ref}" in
            localhost:5000/llm-wiki/p0-oci-fixture@sha256:*) ;;
            *) echo "Synthetic OCI fixture is not digest pinned." >&2; exit 1 ;;
          esac

          cleanup_registry
          trap - EXIT

          docker_executable="$(readlink -f "$(command -v docker)")"
          {
            echo "LLM_WIKI_OCI_DOCKER=${docker_executable}"
            echo "LLM_WIKI_OCI_TEST_IMAGE=${fixture_ref}"
          } >> "${GITHUB_ENV}"

      - name: Run real no-egress broker qualification
        env:
          LLM_WIKI_RUN_OCI_INTEGRATION: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: >-
          python -m pytest
          tests/test_documentation_calibration_oci_integration.py
          -m oci_integration
          -v
