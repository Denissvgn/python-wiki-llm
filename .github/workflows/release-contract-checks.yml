name: Release contract checks

on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact reviewed main SHA to check
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-contract-checks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    name: Native contract checks (Ubuntu coverage owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact reviewed workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the diagnostic to reviewed main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = Denissvgn/python-wiki-llm
          test "${CANDIDATE_SHA}" = "${GITHUB_SHA}"
          test "${WORKFLOW_SHA}" = "${CANDIDATE_SHA}"
      - name: Set up exact native contract Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.18'
      - name: Freeze nonqualifying diagnostic source
        id: freeze
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          python -I release/core_shard_runner.py freeze --root . \
            --candidate-sha "${CANDIDATE_SHA}" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/contract-source"
          python -I - <<'PYTHON'
          import json, os, pathlib
          identity = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "contract-source/identity.json").read_bytes())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("source-sha256=" + identity["source"]["archive_sha256"] + "\n")
          PYTHON
      - name: Extract the frozen Git-free candidate
        run: >-
          python -I release/qualification.py extract-source
          --archive "${RUNNER_TEMP}/contract-source/candidate-source.tar"
          --sha256 "${{ steps.freeze.outputs.source-sha256 }}"
          --destination "${RUNNER_TEMP}/contract-candidate"
      - name: Create the isolated contract environment
        run: python -I release/qualification.py create-venv --path "${RUNNER_TEMP}/contract-venv"
      - name: Install the exact candidate noneditably
        run: python -m pip install --no-cache-dir "${RUNNER_TEMP}/contract-candidate[dev,tokens]"
      - name: Run bounded native contract checks
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: >-
          python -I release/contract_canary.py run
          --root "${RUNNER_TEMP}/contract-candidate"
          --archive "${RUNNER_TEMP}/contract-source/candidate-source.tar"
          --identity "${RUNNER_TEMP}/contract-source/identity.json"
          --source-sha "${CANDIDATE_SHA}" --expected-prefix "${RUNNER_TEMP}/contract-venv"
          --output "${RUNNER_TEMP}/release-contracts"
      - name: Retain complete or partial diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: release-contract-checks-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-contracts/
            ${{ runner.temp }}/contract-source/identity.json
            ${{ runner.temp }}/contract-source/freeze.json
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: Native contract checks (Windows fixture owner)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact reviewed workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the diagnostic to reviewed main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = Denissvgn/python-wiki-llm
          test "${CANDIDATE_SHA}" = "${GITHUB_SHA}"
          test "${WORKFLOW_SHA}" = "${CANDIDATE_SHA}"
      - name: Set up exact native contract Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13.17'
      - name: Freeze nonqualifying diagnostic source
        id: freeze
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          python -I release/core_shard_runner.py freeze --root . \
            --candidate-sha "${CANDIDATE_SHA}" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/contract-source"
          python -I - <<'PYTHON'
          import json, os, pathlib
          identity = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "contract-source/identity.json").read_bytes())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("source-sha256=" + identity["source"]["archive_sha256"] + "\n")
          PYTHON
      - name: Extract the frozen Git-free candidate
        run: >-
          python -I release/qualification.py extract-source
          --archive "${RUNNER_TEMP}/contract-source/candidate-source.tar"
          --sha256 "${{ steps.freeze.outputs.source-sha256 }}"
          --destination "${RUNNER_TEMP}/contract-candidate"
      - name: Create the isolated contract environment
        run: python -I release/qualification.py create-venv --path "${RUNNER_TEMP}/contract-venv"
      - name: Install the exact candidate noneditably
        run: python -m pip install --no-cache-dir "${RUNNER_TEMP}/contract-candidate[dev,tokens]"
      - name: Run bounded native contract checks
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: >-
          python -I release/contract_canary.py run
          --root "${RUNNER_TEMP}/contract-candidate"
          --archive "${RUNNER_TEMP}/contract-source/candidate-source.tar"
          --identity "${RUNNER_TEMP}/contract-source/identity.json"
          --source-sha "${CANDIDATE_SHA}" --expected-prefix "${RUNNER_TEMP}/contract-venv"
          --output "${RUNNER_TEMP}/release-contracts"
      - name: Retain complete or partial diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: release-contract-checks-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-contracts/
            ${{ runner.temp }}/contract-source/identity.json
            ${{ runner.temp }}/contract-source/freeze.json
          if-no-files-found: warn
          retention-days: 14
