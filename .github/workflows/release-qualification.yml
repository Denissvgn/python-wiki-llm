          fail-on: warning
      - name: Assert both invalid inputs failed closed
        env:
          STRICT_OUTCOME: ${{ steps.invalid-strict.outcome }}
          FAIL_ON_OUTCOME: ${{ steps.invalid-fail-on.outcome }}
        run: |
          test "${STRICT_OUTCOME}" = failure
          test "${FAIL_ON_OUTCOME}" = failure
          mkdir -p evidence
          printf '%s\n' \
            '{"context_health":"PASS","fail_on_invalid":"PASS","schema_version":"agent-wiki-release-action-result/v1","strict_invalid":"PASS"}' \
            > evidence/action-result.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-rd-10
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  build:
    name: RD-11 independent build ${{ matrix.copy }}
    needs: freeze
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    env:
      SOURCE_DATE_EPOCH: ${{ needs.freeze.outputs.commit-epoch }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-source
          path: incoming/source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-harnesses
          path: incoming/tools
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify and extract qualification harnesses
        env:
          EXPECTED_HARNESS_SHA256: ${{ needs.freeze.outputs.harness-sha256 }}
        run: |
          python -I -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(path.read_bytes()).hexdigest(); print(f"qualification harness sha256={actual}"); raise SystemExit(0 if actual == sys.argv[2] else "qualification harness digest mismatch")' \
            incoming/tools/qualification-harnesses.tar \
            "${EXPECTED_HARNESS_SHA256}"
          python -I -m tarfile --extract \
            incoming/tools/qualification-harnesses.tar incoming/tools
          test -f incoming/tools/release/qualification.py
          test -f incoming/tools/tests/release_artifact_smoke.py
      - name: Extract source and create isolated builder
        run: |
          python -I incoming/tools/release/qualification.py extract-source \
            --archive incoming/source/candidate-source.tar \
            --sha256 "${{ needs.freeze.outputs.source-sha256 }}" \
            --destination candidate
          python -I incoming/tools/release/qualification.py create-venv \
            --path "${RUNNER_TEMP}/build-venv"
      - name: Install hash-locked build tools
        run: >-
          python -m pip install --require-hashes --no-cache-dir
          -r candidate/release/requirements.txt
      - name: Build and validate both distributions
        run: |
          mkdir dist
          python -m build --no-isolation --sdist --wheel \
            --outdir dist candidate
          twine check dist/*
          python candidate/tests/verify_installed_knowledge_schema.py dist
      - name: Upload independent build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.copy }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  reproducible:
    name: RD-11 compare independent build bytes
    needs: [freeze, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-harnesses
          path: incoming/tools
      - name: Verify and extract qualification harnesses
        env:
          EXPECTED_HARNESS_SHA256: ${{ needs.freeze.outputs.harness-sha256 }}
        run: |
          python -I -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(path.read_bytes()).hexdigest(); print(f"qualification harness sha256={actual}"); raise SystemExit(0 if actual == sys.argv[2] else "qualification harness digest mismatch")' \
            incoming/tools/qualification-harnesses.tar \
            "${EXPECTED_HARNESS_SHA256}"
          python -I -m tarfile --extract \
            incoming/tools/qualification-harnesses.tar incoming/tools
          test -f incoming/tools/release/qualification.py
          test -f incoming/tools/tests/release_artifact_smoke.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-a
          path: incoming/a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-b
          path: incoming/b
      - name: Require byte-identical wheel and sdist
        run: >-
          python -I incoming/tools/release/qualification.py compare-builds
          --first incoming/a
          --second incoming/b
          --output reproducible
      - name: Upload selected reproducible artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducible-build
          path: reproducible/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  artifact-smoke:
    name: RD-12 artifact-only ${{ matrix.kind }} smoke
    needs: [freeze, reproducible]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - name: Download only the selected distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reproducible-build
          path: incoming/release
      - name: Download independently transferred smoke harness
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-harnesses
          path: incoming/tools
      - name: Set up clean Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify and extract qualification harnesses
        env:
          EXPECTED_HARNESS_SHA256: ${{ needs.freeze.outputs.harness-sha256 }}
        run: |
          python -I -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(path.read_bytes()).hexdigest(); print(f"qualification harness sha256={actual}"); raise SystemExit(0 if actual == sys.argv[2] else "qualification harness digest mismatch")' \
            incoming/tools/qualification-harnesses.tar \
            "${EXPECTED_HARNESS_SHA256}"
          python -I -m tarfile --extract \
            incoming/tools/qualification-harnesses.tar incoming/tools
          test -f incoming/tools/release/qualification.py
          test -f incoming/tools/tests/release_artifact_smoke.py
      - name: Create default and MCP artifact environments
        run: |
          python -m venv "${RUNNER_TEMP}/default-venv"
          python -m venv "${RUNNER_TEMP}/mcp-venv"
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact="$(find incoming/release/dist -maxdepth 1 -name '*.whl' -print)"
          else
            artifact="$(find incoming/release/dist -maxdepth 1 -name '*.tar.gz' -print)"
          fi
          test -n "${artifact}"
          "${RUNNER_TEMP}/default-venv/bin/python" -m pip install \
            --no-cache-dir "${artifact}"
          "${RUNNER_TEMP}/mcp-venv/bin/python" -m pip install \
            --no-cache-dir "${artifact}[mcp]"
          echo "ARTIFACT=${artifact}" >> "${GITHUB_ENV}"
      - name: Run without a source checkout
        run: >-
          python -I incoming/tools/tests/release_artifact_smoke.py
          --artifact "${ARTIFACT}"
          --python "${RUNNER_TEMP}/default-venv/bin/python"
          --mcp-python "${RUNNER_TEMP}/mcp-venv/bin/python"
          --expected-version "${{ needs.freeze.outputs.version }}"
          --work artifact-smoke-work
          --output "smoke-${{ matrix.kind }}.json"
      - name: Upload canonical smoke result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-${{ matrix.kind }}
          path: smoke-${{ matrix.kind }}.json
          if-no-files-found: error
          retention-days: 14

  smoke-parity:
    name: RD-12 wheel/sdist parity
    needs: [freeze, artifact-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-harnesses
          path: incoming/tools
      - name: Verify and extract qualification harnesses
        env:
          EXPECTED_HARNESS_SHA256: ${{ needs.freeze.outputs.harness-sha256 }}
        run: |
          python -I -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(path.read_bytes()).hexdigest(); print(f"qualification harness sha256={actual}"); raise SystemExit(0 if actual == sys.argv[2] else "qualification harness digest mismatch")' \
            incoming/tools/qualification-harnesses.tar \
            "${EXPECTED_HARNESS_SHA256}"
          python -I -m tarfile --extract \
            incoming/tools/qualification-harnesses.tar incoming/tools
          test -f incoming/tools/release/qualification.py
          test -f incoming/tools/tests/release_artifact_smoke.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-wheel
          path: incoming/wheel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-sdist
          path: incoming/sdist
      - name: Require identical installed behavior
        run: >-
          python -I incoming/tools/release/qualification.py compare-smoke
          --wheel incoming/wheel/smoke-wheel.json
          --sdist incoming/sdist/smoke-sdist.json
          --output smoke-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-comparison
          path: smoke-comparison.json
          if-no-files-found: error
          retention-days: 14

  owner-lanes:
    name: Require every allowlisted skip owner to pass
    if: ${{ always() && !inputs.discovery-mode && needs.freeze.result == 'success' }}
    needs:
      - freeze
      - core
      - slow
      - security-behavior
      - product
      - mcp
      - toolchains
      - oci
      - static
      - action
      - reproducible
      - artifact-smoke
      - smoke-parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-source
          path: incoming/source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-harnesses
          path: incoming/tools
      - name: Verify and extract qualification harnesses
        env:
          EXPECTED_HARNESS_SHA256: ${{ needs.freeze.outputs.harness-sha256 }}
        run: |
          python -I -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(path.read_bytes()).hexdigest(); print(f"qualification harness sha256={actual}"); raise SystemExit(0 if actual == sys.argv[2] else "qualification harness digest mismatch")' \
            incoming/tools/qualification-harnesses.tar \
            "${EXPECTED_HARNESS_SHA256}"
          python -I -m tarfile --extract \
            incoming/tools/qualification-harnesses.tar incoming/tools
          test -f incoming/tools/release/qualification.py
          test -f incoming/tools/tests/release_artifact_smoke.py
      - name: Download owner-lane JUnit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-*
          path: incoming/owner-evidence
      - name: Extract the committed skip contract
        run: >-
          python -I incoming/tools/release/qualification.py extract-source
          --archive incoming/source/candidate-source.tar
          --sha256 "${{ needs.freeze.outputs.source-sha256 }}"
          --destination candidate
      - name: Verify reviewed owners against hosted lane results
        run: |
          test "${{ needs.core.result }}" = "success"
          python -I incoming/tools/release/qualification.py verify-owner-lanes \
            --identity incoming/source/identity.json \
            --allowlist candidate/release/skip-allowlist.json \
            --owner-result "core-ubuntu-3.10=${{ needs.core.result }}" \
            --owner-junit "core-ubuntu-3.10=incoming/owner-evidence/evidence-core-ubuntu-3.10/core-ubuntu-3.10.xml" \
            --owner-result "core-windows-3.13=${{ needs.core.result }}" \
            --owner-junit "core-windows-3.13=incoming/owner-evidence/evidence-core-windows-3.13/core-windows-3.13.xml" \
            --owner-result "core-macos-3.14=${{ needs.core.result }}" \
            --owner-junit "core-macos-3.14=incoming/owner-evidence/evidence-core-macos-3.14/core-macos-3.14.xml" \
            --owner-result "slow=${{ needs.slow.result }}" \
            --owner-junit "slow=incoming/owner-evidence/evidence-rd-03/slow.xml" \
            --owner-result "determinism=${{ needs.slow.result }}" \
            --owner-junit "determinism=incoming/owner-evidence/evidence-rd-03/determinism.xml" \
            --owner-result "security-ubuntu-24.04=${{ needs.security-behavior.result }}" \
            --owner-junit "security-ubuntu-24.04=incoming/owner-evidence/evidence-rd-04-ubuntu-24.04/security-ubuntu-24.04.xml" \
            --owner-result "security-windows-2025=${{ needs.security-behavior.result }}" \
            --owner-junit "security-windows-2025=incoming/owner-evidence/evidence-rd-04-windows-2025/security-windows-2025.xml" \
            --owner-result "security-macos-15=${{ needs.security-behavior.result }}" \
            --owner-junit "security-macos-15=incoming/owner-evidence/evidence-rd-04-macos-15/security-macos-15.xml" \
            --owner-result "product-ubuntu-24.04=${{ needs.product.result }}" \
            --owner-junit "product-ubuntu-24.04=incoming/owner-evidence/evidence-rd-05-ubuntu-24.04/product-ubuntu-24.04.xml" \
            --owner-result "product-windows-2025=${{ needs.product.result }}" \
            --owner-junit "product-windows-2025=incoming/owner-evidence/evidence-rd-05-windows-2025/product-windows-2025.xml" \
            --owner-result "mcp-3.10=${{ needs.mcp.result }}" \
            --owner-junit "mcp-3.10=incoming/owner-evidence/evidence-rd-06-3.10/mcp-3.10.xml" \
            --owner-result "mcp-3.13=${{ needs.mcp.result }}" \
            --owner-junit "mcp-3.13=incoming/owner-evidence/evidence-rd-06-3.13/mcp-3.13.xml" \
            --owner-result "toolchains=${{ needs.toolchains.result }}" \
            --owner-junit "toolchains=incoming/owner-evidence/evidence-rd-07/toolchains.xml" \
            --owner-result "oci=${{ needs.oci.result }}" \
            --owner-junit "oci=incoming/owner-evidence/evidence-rd-08/oci.xml" \
            --output owner-lane-verification.json
      - name: Upload owner-lane verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-owner-lanes
          path: owner-lane-verification.json
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Assemble immutable qualified release
    needs:
      - freeze
      - core
      - slow
      - security-behavior
      - product
      - mcp
      - toolchains
      - oci
      - static
      - action
      - reproducible
      - smoke-parity
      - owner-lanes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      wheel-sha256: ${{ steps.bundle.outputs.wheel-sha256 }}
      sdist-sha256: ${{ steps.bundle.outputs.sdist-sha256 }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-source
          path: incoming/source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-harnesses
          path: incoming/tools
      - name: Verify and extract qualification harnesses
        env:
          EXPECTED_HARNESS_SHA256: ${{ needs.freeze.outputs.harness-sha256 }}
        run: |
          python -I -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(path.read_bytes()).hexdigest(); print(f"qualification harness sha256={actual}"); raise SystemExit(0 if actual == sys.argv[2] else "qualification harness digest mismatch")' \
            incoming/tools/qualification-harnesses.tar \
            "${EXPECTED_HARNESS_SHA256}"
          python -I -m tarfile --extract \
            incoming/tools/qualification-harnesses.tar incoming/tools
          test -f incoming/tools/release/qualification.py
          test -f incoming/tools/tests/release_artifact_smoke.py
      - name: Download all hosted gate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-*
          path: incoming/gates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reproducible-build
          path: incoming/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-wheel
          path: incoming/wheel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-sdist
          path: incoming/sdist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-comparison
          path: incoming/comparison
      - name: Bind actual hosted job conclusions to the candidate
        run: >-
          python -I incoming/tools/release/qualification.py aggregate
          --candidate-sha "${{ needs.freeze.outputs.sha }}"
          --candidate-version "${{ needs.freeze.outputs.version }}"
          --gate "RD-00=${{ needs.freeze.result }}"
          --gate "RD-01=${{ needs.core.result }}"
          --gate "RD-02=${{ needs.owner-lanes.result }}"
          --gate "RD-03=${{ needs.slow.result }}"
          --gate "RD-04=${{ needs.security-behavior.result }}"
          --gate "RD-05=${{ needs.product.result }}"
          --gate "RD-06=${{ needs.mcp.result }}"
          --gate "RD-07=${{ needs.toolchains.result }}"
          --gate "RD-08=${{ needs.oci.result }}"
          --gate "RD-09=${{ needs.static.result }}"
          --gate "RD-10=${{ needs.action.result }}"
          --gate "RD-11=${{ needs.reproducible.result }}"
          --gate "RD-12=${{ needs.smoke-parity.result }}"
          --gate "RD-13=BLOCKED"
          --allow-non-go-exit-zero
          --output gate-decision.json
      - name: Build versioned release bundle
        id: bundle
        run: >-
          python -I incoming/tools/release/qualification.py build-bundle
          --identity incoming/source/identity.json
          --dist incoming/release/dist
          --wheel-smoke incoming/wheel/smoke-wheel.json
          --sdist-smoke incoming/sdist/smoke-sdist.json
          --smoke-comparison incoming/comparison/smoke-comparison.json
          --gate-decision gate-decision.json
          --evidence "RD-00:source=incoming/source"
          --evidence "RD-00:harness=incoming/tools/qualification-harnesses.tar"
          --evidence "RD-01:ubuntu=incoming/gates/evidence-core-ubuntu-3.10"
          --evidence "RD-01:windows=incoming/gates/evidence-core-windows-3.13"
          --evidence "RD-01:macos=incoming/gates/evidence-core-macos-3.14"
          --evidence "RD-02:owners=incoming/gates/evidence-owner-lanes"
          --evidence "RD-03:slow=incoming/gates/evidence-rd-03"
          --evidence "RD-04:ubuntu=incoming/gates/evidence-rd-04-ubuntu-24.04"
          --evidence "RD-04:windows=incoming/gates/evidence-rd-04-windows-2025"
          --evidence "RD-04:macos=incoming/gates/evidence-rd-04-macos-15"
          --evidence "RD-05:ubuntu=incoming/gates/evidence-rd-05-ubuntu-24.04"
          --evidence "RD-05:windows=incoming/gates/evidence-rd-05-windows-2025"
          --evidence "RD-06:python310=incoming/gates/evidence-rd-06-3.10"
          --evidence "RD-06:python313=incoming/gates/evidence-rd-06-3.13"
          --evidence "RD-07:toolchains=incoming/gates/evidence-rd-07"
          --evidence "RD-08:oci=incoming/gates/evidence-rd-08"
          --evidence "RD-09:static=incoming/gates/evidence-rd-09"
          --evidence "RD-10:action=incoming/gates/evidence-rd-10"
          --evidence "RD-11:reproducible=incoming/release/reproducible-build.json"
          --evidence "RD-12:wheel=incoming/wheel/smoke-wheel.json"
          --evidence "RD-12:sdist=incoming/sdist/smoke-sdist.json"
          --evidence "RD-12:comparison=incoming/comparison/smoke-comparison.json"
          --workflow-run-id "${{ github.run_id }}"
          --output qualified-release
      - name: Self-verify the completed bundle
        run: >-
          python -I incoming/tools/release/qualification.py verify-bundle
          --bundle qualified-release
          --repository "${{ github.repository }}"
          --workflow-run-id "${{ github.run_id }}"
          --candidate-sha "${{ needs.freeze.outputs.sha }}"
          --wheel-sha256 "${{ steps.bundle.outputs.wheel-sha256 }}"
          --sdist-sha256 "${{ steps.bundle.outputs.sdist-sha256 }}"
      - name: Upload immutable qualification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-release
          path: qualified-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Attest exact qualified distributions
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3.0.0
        with:
          subject-path: qualified-release/dist/*

      - name: Attest the SPDX SBOM for exact qualified distributions
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: qualified-release/dist/*
          sbom-path: qualified-release/sbom.spdx.json

  decision:
    name: Aggregate RD-00 through RD-13
    if: always()
    needs:
      - freeze
      - core
      - slow
      - security-behavior
      - product
      - mcp
      - toolchains
      - oci
      - static
      - action
      - reproducible
      - smoke-parity
      - owner-lanes
      - bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.freeze.result == 'success' }}
        with:
          name: qualification-harnesses
          path: incoming/tools
      - name: Verify and extract qualification harnesses
        if: ${{ needs.freeze.result == 'success' }}
        env:
          EXPECTED_HARNESS_SHA256: ${{ needs.freeze.outputs.harness-sha256 }}
        run: |
          python -I -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); actual = hashlib.sha256(path.read_bytes()).hexdigest(); print(f"qualification harness sha256={actual}"); raise SystemExit(0 if actual == sys.argv[2] else "qualification harness digest mismatch")' \
            incoming/tools/qualification-harnesses.tar \
            "${EXPECTED_HARNESS_SHA256}"
          python -I -m tarfile --extract \
            incoming/tools/qualification-harnesses.tar incoming/tools
          test -f incoming/tools/release/qualification.py
          test -f incoming/tools/tests/release_artifact_smoke.py
      - name: Emit deterministic aggregate
        if: ${{ needs.freeze.result == 'success' }}
        run: >-
          python -I incoming/tools/release/qualification.py aggregate
          --candidate-sha "${{ needs.freeze.outputs.sha }}"
          --candidate-version "${{ needs.freeze.outputs.version }}"
          --gate "RD-00=${{ needs.freeze.result }}"
          --gate "RD-01=${{ needs.core.result }}"
          --gate "RD-02=${{ needs.owner-lanes.result }}"
          --gate "RD-03=${{ needs.slow.result }}"
          --gate "RD-04=${{ needs.security-behavior.result }}"
          --gate "RD-05=${{ needs.product.result }}"
          --gate "RD-06=${{ needs.mcp.result }}"
          --gate "RD-07=${{ needs.toolchains.result }}"
          --gate "RD-08=${{ needs.oci.result }}"
          --gate "RD-09=${{ needs.static.result }}"
          --gate "RD-10=${{ needs.action.result }}"
          --gate "RD-11=${{ needs.reproducible.result }}"
          --gate "RD-12=${{ needs.smoke-parity.result }}"
          --gate "RD-13=BLOCKED"
          --allow-non-go-exit-zero
          --output decision.json
      - name: Upload pre-promotion decision
        if: ${{ always() && needs.freeze.result == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-decision
          path: decision.json
          if-no-files-found: error
          retention-days: 14
