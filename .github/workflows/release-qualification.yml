          actionlint_version="$(
            python -I incoming/tools/release/qualification.py lock-value \
              --lock candidate/release/toolchain-lock.json \
              --key qualification_tools.actionlint.version_output
          )"
          (
            cd "${RUNNER_TEMP}/actionlint-source"
            go install \
              -ldflags="-X github.com/rhysd/actionlint.version=${actionlint_version}" \
