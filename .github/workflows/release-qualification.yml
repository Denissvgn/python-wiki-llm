          python -I incoming/tools/release/qualification.py verify-download \
            --lock candidate/release/toolchain-lock.json \
            --key qualification_tools.actionlint.source \
            --output "${RUNNER_TEMP}/actionlint.tar.gz"
          mkdir -p "${RUNNER_TEMP}/actionlint-source"
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" \
