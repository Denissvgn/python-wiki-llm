      - name: Extract source
        run: >-
          python -I incoming/tools/release/qualification.py extract-source
          --archive incoming/source/candidate-source.tar
          --sha256 "${{ needs.freeze.outputs.source-sha256 }}"
          --destination candidate
      - name: Build repository-owned fixture
        env:
          BOOTSTRAP_VENV: ${{ runner.temp }}/action-bootstrap
        run: |
          python -m venv "${BOOTSTRAP_VENV}"
          "${BOOTSTRAP_VENV}/bin/python" -m pip install --no-input ./candidate
          "${BOOTSTRAP_VENV}/bin/llm-wiki" bootstrap \
            --src-dir candidate/tests/fixtures/context-health-action/source \
            --wiki-dir candidate/.action-selftest/wiki \
            --skip-workflows --skip-flows --skip-dependencies
      - name: Verify the Action interpreter is clean
        run: |
          if python -m pip show agent-wiki-cli >/dev/null 2>&1; then
            exit 1
          fi
      - name: Run context health gate
        uses: ./candidate/integrations/github-action
        with:
          wiki-dir: candidate/.action-selftest/wiki
