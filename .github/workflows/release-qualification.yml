          bandit --version | tee evidence/bandit-version.txt
          pip-audit --version | tee evidence/pip-audit-version.txt
          actionlint --version | tee evidence/actionlint-version.txt
          test "$(actionlint --version | head -n1)" = \
            "$(python -I incoming/tools/release/qualification.py lock-value --lock candidate/release/toolchain-lock.json --key qualification_tools.actionlint.version_output)"
      - name: Run static checks
        working-directory: candidate
        run: |
          pyright
          ruff check src tests integrations/github-action/render_summary.py
          bandit -r src/llm_wiki_cli -f json \
            -o ../evidence/security/bandit-full.json || true
          bandit -r src/llm_wiki_cli -lll -iii
          pip-audit --local --format json \
            --output ../evidence/security/pip-audit.json
          actionlint .github/workflows/*.yml
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
