name: Sibling wiki impact report

"on":
  pull_request:
  push:
  gollum:
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:
    inputs:
      baseline:
        description: Accepted snapshot path; defaults to SIBLING_WIKI_BASELINE or an initial assessment
        type: string
        default: ""
        required: false
      reviews:
        description: Accepted ledger path; defaults to SIBLING_WIKI_REVIEWS when configured
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: sibling-wiki-impact-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Read-only sibling wiki impact (snapshot evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the source and accepted history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the provider from the same revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: .provider
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /integrations/wiki-impact/
            /integrations/wiki-candidate/
            /pyproject.toml
            /release_build_backend.py
            /MANIFEST.in
            /README.md
            /LICENSE
            /docs/standalone-documentation.md

      - name: Verify local inputs and read the public sibling wiki
        shell: bash
        working-directory: consumer
        env:
          RUN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          ACCEPTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          ACCEPTED_BASELINE: ${{ inputs.baseline || vars.SIBLING_WIKI_BASELINE }}
          ACCEPTED_REVIEWS: ${{ inputs.reviews || vars.SIBLING_WIKI_REVIEWS }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          [[ "${RUN_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${RUN_SHA}" ]]
          [[ "$(git -C ../.provider rev-parse HEAD)" == "${RUN_SHA}" ]]
          [[ "${ACCEPTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${SERVER_URL}" == https://github.com ]]
          for accepted_artifact in "${ACCEPTED_BASELINE}" "${ACCEPTED_REVIEWS}"; do
            [[ -n "${accepted_artifact}" ]] || continue
            case "${accepted_artifact}" in
              /*|-*|*/|*//*|*\\*|*$'\n'*|*$'\r'*)
                printf 'Accepted state must use repository-relative artifact paths.\n' >&2
                exit 2
                ;;
            esac
            IFS=/ read -r -a components <<< "${accepted_artifact}"
            for component in "${components[@]}"; do
              [[ -n "${component}" && "${component}" != . && "${component}" != .. ]] || exit 2
            done
            mode="$(git --literal-pathspecs ls-tree --format='%(objectmode) %(objecttype)' "${ACCEPTED_SHA}" -- "${accepted_artifact}")"
            [[ "${mode}" == '100644 blob' || "${mode}" == '100755 blob' ]] || exit 2
          done
          [[ ! -e sibling-wiki && ! -L sibling-wiki ]]
          git -c credential.helper= -c core.askPass= -c http.followRedirects=false clone \
            --single-branch --no-tags --config core.autocrlf=false \
            "${SERVER_URL}/${REPOSITORY}.wiki.git" sibling-wiki
          printf '%s\n' \
            'This report uses validated native snapshot evidence only. Live source freshness requires the owning native integrity workflow.' \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Report affected public sections and coverage
        uses: ./.provider/integrations/wiki-impact
        with:
          working-directory: consumer
          config: .llm-wiki/publication.json
          baseline: ${{ inputs.baseline || vars.SIBLING_WIKI_BASELINE }}
          reviews: ${{ inputs.reviews || vars.SIBLING_WIKI_REVIEWS }}
          accepted-state-revision: ${{ github.event.pull_request.base.sha || github.sha }}
          target-dir: sibling-wiki
          observe-drift: ${{ github.event_name != 'pull_request' }}
          fail-on: error
