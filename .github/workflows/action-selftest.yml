name: Context health action

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      provider-ref:
        description: Full pinned provider SHA for real caller conformance
        type: string
        required: true
        default: "63c8fa7b264610b57f0f1e24c9327eb92d8b0819"
concurrency:
  group: context-health-action-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repository-fixture:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build repository-owned wiki fixture
        env:
          BOOTSTRAP_VENV: ${{ runner.temp }}/agent-wiki-bootstrap
        run: |
          set -euo pipefail
          python -m venv "${BOOTSTRAP_VENV}"
          "${BOOTSTRAP_VENV}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            .
          "${BOOTSTRAP_VENV}/bin/llm-wiki" bootstrap \
            --src-dir tests/fixtures/context-health-action/source \
            --wiki-dir .action-selftest/wiki \
            --skip-workflows \
            --skip-flows \
            --skip-dependencies

      - name: Verify the action interpreter is clean
        run: |
          if python -m pip show agent-wiki-cli >/dev/null 2>&1; then
            echo "agent-wiki-cli unexpectedly exists outside the bootstrap environment" >&2
            exit 1
          fi

      - name: Check Action fixture knowledge health
        uses: ./integrations/github-action
        with:
          report-schema: v4
          comparison-policy: analysis-v1
          wiki-dir: .action-selftest/wiki
          src-dir: tests/fixtures/context-health-action/source
          strict: "true"
          fail-on: unhealthy
          evidence-id: valid

      - name: "Expected failure: Reject an invalid strict input"
        id: invalid-strict
        continue-on-error: true
        uses: ./integrations/github-action
        with:
          wiki-dir: .action-selftest/wiki
          src-dir: tests/fixtures/context-health-action/source
          strict: "yes"
          fail-on: unhealthy
          evidence-id: invalid-strict

      - name: Assert invalid strict failed closed
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.invalid-strict.outcome }}
        run: |
          test "${STEP_OUTCOME}" = "failure"

      - name: "Expected failure: Reject an invalid evidence ID"
        id: invalid-evidence-id
        continue-on-error: true
        uses: ./integrations/github-action
        with:
          wiki-dir: .action-selftest/wiki
          src-dir: tests/fixtures/context-health-action/source
          strict: "true"
          fail-on: unhealthy
          evidence-id: Invalid/evidence

      - name: Assert invalid evidence ID failed closed
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.invalid-evidence-id.outcome }}
        run: |
          test "${STEP_OUTCOME}" = "failure"

      - name: "Expected failure: Reject an invalid failure threshold"
        id: invalid-fail-on
        continue-on-error: true
        uses: ./integrations/github-action
        with:
          wiki-dir: .action-selftest/wiki
          src-dir: tests/fixtures/context-health-action/source
          strict: "true"
          fail-on: warning
          evidence-id: invalid-fail-on

      - name: Assert invalid failure threshold failed closed
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.invalid-fail-on.outcome }}
        run: |
          test "${STEP_OUTCOME}" = "failure"


  wiki-candidate:
    name: Sibling wiki candidate from a source-only caller
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the provider
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: .provider
          persist-credentials: false

      - name: Create a separate consumer revision
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet --initial-branch=fixture consumer
          git -C .provider archive HEAD:examples/sibling-wiki | tar -x -C consumer
          git -C consumer add .
          git -C consumer -c user.name=Fixture -c user.email=fixture@example.invalid \
            commit --quiet -m 'Source-only consumer'
          git -C consumer status -sb
          test -z "$(git -C consumer for-each-ref --format='%(upstream:short)' refs/heads/fixture)"

      - name: Prepare a reviewable candidate
        id: candidate
        uses: ./.provider/integrations/wiki-candidate
        with:
          working-directory: consumer
          target-dir: sibling-wiki

      - name: Verify revision binding, manual content and review outputs
        shell: bash
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate-dir }}
          RECEIPT: ${{ steps.candidate.outputs.receipt-path }}
          REPORT: ${{ steps.candidate.outputs.report-path }}
          DIFF: ${{ steps.candidate.outputs.diff-path }}
          PROVIDER_RECEIPT: ${{ steps.candidate.outputs.provider-receipt }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          READY: ${{ steps.candidate.outputs.ready }}
        run: |
          set -euo pipefail
          test "${CHANGED}" = true
          test "${READY}" = false
          test -s "${REPORT}" && test -s "${DIFF}" && test -s "${PROVIDER_RECEIPT}"
          "${pythonLocation}/bin/python" -I - "${PROVIDER_RECEIPT}" "${RECEIPT}" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          provider, receipt = [json.loads(Path(path).read_bytes()) for path in sys.argv[1:]]
          provider_sha, source_sha = [
              subprocess.check_output(["git", "-C", repo, "rev-parse", "HEAD"], text=True).strip()
              for repo in (".provider", "consumer")
          ]
          assert provider["installed"] and provider["action_ref"] == provider["provider_revision"] == provider_sha
          assert receipt["context"]["source_revision"] == source_sha != provider_sha
          assert receipt["checks"]["ok"] and not receipt["ready"] and not receipt["delivery_ready"]
          assert receipt["target"]["remote_verified"] is False
          PY
          test -s "${CANDIDATE_DIR}/Home.md"
          cmp consumer/sibling-wiki/Wiki-Tooling.md "${CANDIDATE_DIR}/Wiki-Tooling.md"
          test -z "$(git -C consumer status --porcelain=v1 --untracked-files=all)"

  wiki-candidate-typescript:
    name: Source-only TypeScript wiki candidate
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: .provider
          persist-credentials: false
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.18"
      - name: Install and verify the provider outside the consumer
        id: provider
        shell: bash
        env:
          PROVIDER_PYTHON: ${{ steps.python.outputs.python-path }}
          INPUT_WORKING_DIRECTORY: .
          INPUT_EVIDENCE_ID: typescript-consumer
        run: '"${PROVIDER_PYTHON}" -B -I .provider/integrations/wiki-candidate/provider.py'
      - name: Install the locked Node and npm for the selected TypeScript helper
        shell: bash
        env:
          WIKI_PYTHON: ${{ steps.provider.outputs.python }}
          WIKI_RUNTIME: ${{ steps.provider.outputs.runtime }}
        run: >-
          .provider/.github/scripts/setup-llm-wiki-ci-toolchains.sh
          --mode routine --install-root "${WIKI_RUNTIME}/toolchains"
          --lock .provider/release/toolchain-lock.json --python "${WIKI_PYTHON}"
      - name: Prepare the selected helper
        shell: bash
        env:
          WIKI_PYTHON: ${{ steps.provider.outputs.python }}
          WIKI_RUNTIME: ${{ steps.provider.outputs.runtime }}
        run: |
          set -euo pipefail
          mkdir "${WIKI_RUNTIME}/seed"
          cd "${WIKI_RUNTIME}/seed"
          "${WIKI_PYTHON}" -I -m llm_wiki_cli.cli prepare-extractors \
            --src-dir . --language typescript --cache-dir "${WIKI_RUNTIME}/helpers" \
            > "${WIKI_RUNTIME}/evidence/preparation.log" 2>&1
      - name: Verify the installed source-only consumer with existing dependencies
        shell: bash
        env:
          WIKI_PYTHON: ${{ steps.provider.outputs.python }}
          WIKI_RUNTIME: ${{ steps.provider.outputs.runtime }}
          PIP_NO_INDEX: "1"
          npm_config_offline: "true"
        run: >-
          "${WIKI_PYTHON}" -B -I .provider/tests/fixtures/sibling-wiki/verify_typescript_consumer.py
          --workspace "${WIKI_RUNTIME}/consumer"
          --helper-cache "${WIKI_RUNTIME}/helpers"
          --output "${WIKI_RUNTIME}/evidence/consumer.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && steps.provider.outputs.evidence-dir != '' }}
        with:
          name: wiki-candidate-typescript-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          path: ${{ steps.provider.outputs.evidence-dir }}
          if-no-files-found: error
          retention-days: 14

  foreign-caller:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: Foreign caller (${{ matrix.integration }}, ${{ matrix.state }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        integration: [context, integrity]
        state: [clean, drift, corrupt]
    steps:
      - name: Check out provider separately from caller sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .provider
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Prepare locked bootstrap Go
        shell: bash
        run: >-
          bash .provider/.github/scripts/setup-llm-wiki-ci-toolchains.sh
          --mode extractor-go --install-root "${RUNNER_TEMP}/foreign-bootstrap-tools"
          --python "$(command -v python)"
      - name: Freeze independent caller source and wiki
        shell: bash
        env:
          FIXTURE_CASE: ${{ matrix.state }}
          FIXTURE_KIND: ${{ matrix.integration }}
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/foreign-bootstrap-venv"
          "${RUNNER_TEMP}/foreign-bootstrap-venv/bin/python" -m pip install ./.provider
          "${RUNNER_TEMP}/foreign-bootstrap-venv/bin/python" -I             .provider/tests/provider_conformance/action_fixture.py prepare             --case "${FIXTURE_CASE}" --kind "${FIXTURE_KIND}"             --helper-cache "${RUNNER_TEMP}/foreign-bootstrap-cache"             --evidence "${RUNNER_TEMP}/foreign-caller-evidence"
      - name: Check foreign caller fixture knowledge health
        id: foreign-context
        if: ${{ matrix.integration == 'context' }}
        continue-on-error: true
        uses: ./.provider/integrations/github-action
        with:
          src-dir: source
          wiki-dir: wiki
          strict: "true"
          fail-on: unhealthy
          evidence-id: foreign
      - name: Check foreign caller fixture integrity
        id: foreign-integrity
        if: ${{ matrix.integration == 'integrity' }}
        continue-on-error: true
        uses: ./.provider/integrations/wiki-integrity
        with:
          src-dir: source
          wiki-dir: wiki
      - name: Verify actual action outcome and unchanged caller
        if: always()
        shell: bash
        env:
          FIXTURE_CASE: ${{ matrix.state }}
          FIXTURE_KIND: ${{ matrix.integration }}
          CONTEXT_OUTCOME: ${{ steps.foreign-context.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.foreign-integrity.outcome }}
        run: |
          set -euo pipefail
          if [[ "${FIXTURE_KIND}" == context ]]; then
            evidence="${RUNNER_TEMP}/llm-wiki-doctor-foreign-evidence"
            outcome="${CONTEXT_OUTCOME}"
          else
            evidence="${RUNNER_TEMP}/llm-wiki-evidence"
            outcome="${INTEGRITY_OUTCOME}"
          fi
          python -I .provider/tests/provider_conformance/action_fixture.py check             --case "${FIXTURE_CASE}" --kind "${FIXTURE_KIND}"             --outcome "${outcome}" --action-evidence "${evidence}"             --evidence "${RUNNER_TEMP}/foreign-caller-evidence"
      - name: Upload caller conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: foreign-caller-${{ matrix.integration }}-${{ matrix.state }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foreign-caller-evidence
          if-no-files-found: error
          retention-days: 14

  real-caller:
    name: Real caller (${{ matrix.project }}, ${{ matrix.integration }}, ${{ matrix.state }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [fastapi, cobra]
        integration: [context, integrity]
        state: [clean, drift, corrupt]
        include:
          - project: fastapi
            repository: fastapi/full-stack-fastapi-template
            source-sha: cb740b656d7a0a6c5e12c7bf8e50343ec94ee9c7
            tool-mode: routine
          - project: cobra
            repository: spf13/cobra
            source-sha: adbc8813901bba65827259daa8e22ff94ec1f30e
            tool-mode: extractor-go
    steps:
      - name: Check out current fixture tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: .tools
          persist-credentials: false
      - name: Check out pinned provider resources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.provider-ref }}
          path: .provider
          persist-credentials: false
      - name: Check out frozen caller source as inert data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source-sha }}
          path: .caller-input
          persist-credentials: false
      - name: Set up bootstrap Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Bind provider and create isolated bootstrap environment
        shell: bash
        env:
          PROVIDER_REF: ${{ inputs.provider-ref }}
          BOOTSTRAP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          [[ "${PROVIDER_REF}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .provider rev-parse HEAD)" = "${PROVIDER_REF}"
          "${BOOTSTRAP_PYTHON}" -m venv .tools/.venv
          .tools/.venv/bin/python -I -m pip install ./.provider
      - name: Prepare the matching locked caller toolchain
        shell: bash
        env:
          TOOL_MODE: ${{ matrix.tool-mode }}
          BOOTSTRAP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          bash .provider/.github/scripts/setup-llm-wiki-ci-toolchains.sh \
            --mode "${TOOL_MODE}" --install-root "${RUNNER_TEMP}/real-bootstrap-toolchains" \
            --python "${BOOTSTRAP_PYTHON}"
      - name: Freeze selected real caller and ordinary clean baseline
        shell: bash
        env:
          CALLER_PROJECT: ${{ matrix.project }}
          PROVIDER_REF: ${{ inputs.provider-ref }}
        run: |
          .tools/.venv/bin/python -I .tools/tests/provider_conformance/real_action_fixture.py prepare \
            --project "${CALLER_PROJECT}" --provider .provider --provider-sha "${PROVIDER_REF}" \
            --checkout .caller-input --helper-cache "${RUNNER_TEMP}/real-bootstrap-cache" \
            --evidence "${RUNNER_TEMP}/real-caller-evidence"
      - name: Freeze independent selected state and ordinary baseline
        if: ${{ matrix.state != 'clean' }}
        shell: bash
        env:
          CALLER_PROJECT: ${{ matrix.project }}
          CALLER_STATE: ${{ matrix.state }}
          PROVIDER_REF: ${{ inputs.provider-ref }}
        run: |
          .tools/.venv/bin/python -I .tools/tests/provider_conformance/real_action_fixture.py mutate \
            --project "${CALLER_PROJECT}" --provider .provider --provider-sha "${PROVIDER_REF}" \
            --case "${CALLER_STATE}" --helper-cache "${RUNNER_TEMP}/real-bootstrap-cache" \
            --evidence "${RUNNER_TEMP}/real-caller-evidence"
      - name: Actual real caller context Action
        id: real-context
        if: ${{ matrix.integration == 'context' }}
        continue-on-error: true
        uses: ./.provider/integrations/github-action
        with:
          src-dir: source
          wiki-dir: wiki
          comparison-policy: exact-v1
          strict: 'true'
          fail-on: unhealthy
          evidence-id: real
      - name: Actual real caller integrity Action
        id: real-integrity
        if: ${{ matrix.integration == 'integrity' }}
        continue-on-error: true
        uses: ./.provider/integrations/wiki-integrity
        with:
          src-dir: source
          wiki-dir: wiki
          comparison-policy: exact-v1
      - name: Verify real caller outcome and invariants
        shell: bash
        env:
          CALLER_PROJECT: ${{ matrix.project }}
          CALLER_KIND: ${{ matrix.integration }}
          CALLER_STATE: ${{ matrix.state }}
          PROVIDER_REF: ${{ inputs.provider-ref }}
          ACTION_PYTHON: ${{ steps.python.outputs.python-path }}
          CONTEXT_OUTCOME: ${{ steps.real-context.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.real-integrity.outcome }}
        run: |
          set -euo pipefail
          if [[ "${CALLER_KIND}" == context ]]; then
            evidence="${RUNNER_TEMP}/llm-wiki-doctor-real-evidence"
            outcome="${CONTEXT_OUTCOME}"
          else
            evidence="${RUNNER_TEMP}/llm-wiki-evidence"
            outcome="${INTEGRITY_OUTCOME}"
          fi
          .tools/.venv/bin/python -I .tools/tests/provider_conformance/real_action_fixture.py check \
            --project "${CALLER_PROJECT}" --provider .provider --provider-sha "${PROVIDER_REF}" \
            --case "${CALLER_STATE}" --kind "${CALLER_KIND}" --outcome "${outcome}" \
            --action-python "${ACTION_PYTHON}" --action-evidence "${evidence}" \
            --evidence "${RUNNER_TEMP}/real-caller-evidence"
      - name: Retain real caller results and failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: true
          name: real-caller-${{ matrix.project }}-${{ matrix.integration }}-${{ matrix.state }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-caller-evidence
          if-no-files-found: error
          retention-days: 14
