name: Native Windows measurement regression

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_developer_value_measure.py
      - tests/developer_value/**
      - .github/workflows/windows-measurement.yml

permissions:
  contents: read

concurrency:
  group: windows-measurement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  measurement:
    name: Windows measurement (${{ matrix.python }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.17", "3.13.18"]
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PYTHON: ${{ matrix.python }}
      CANDIDATE_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact PR test merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up the native Windows interpreter
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create a fresh environment and install the exact candidate
        env:
          BOOTSTRAP_PYTHON: ${{ steps.python.outputs.python-path }}
          EVIDENCE: ${{ runner.temp }}/measurement-${{ matrix.python }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          echo "EVIDENCE=${EVIDENCE}" >> "${GITHUB_ENV}"
          "${BOOTSTRAP_PYTHON}" -m venv .venv
          .venv/Scripts/python.exe -m pip install --no-cache-dir ".[dev,tokens]" 2>&1 | tee "${EVIDENCE}/pip-install.log"
          .venv/Scripts/python.exe -m pip check 2>&1 | tee "${EVIDENCE}/pip-check.log"
          .venv/Scripts/python.exe -m pip freeze --all > "${EVIDENCE}/dependencies.txt"
      - name: Verify source and provider, then run only the complete measurement module
        run: |
          set -euo pipefail
          .venv/Scripts/python.exe -I - <<'PY' 2>&1 | tee "${EVIDENCE}/native-module.log"
          from collections import Counter
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import stat
          import subprocess
          import sys
          import tarfile
          import time
          import tomllib

          root = Path.cwd().resolve()
          out = Path(os.environ["EVIDENCE"]).resolve()
          assert not out.is_relative_to(root)
          assert (
              sys.platform == "win32"
              and platform.python_version() == os.environ["EXPECTED_PYTHON"]
          )
          assert Path(sys.prefix).resolve() == root / ".venv"
          target = "tests/test_developer_value_measure.py"
          source = os.environ["CANDIDATE_SHA"]
          head = os.environ["HEAD_SHA"]
          base = os.environ["BASE_SHA"]


          def save(name, value):
              (out / name).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )


          def sha(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()


          def git(*args):
              return subprocess.check_output(["git", *args], cwd=root)


          assert git("rev-parse", "HEAD").decode().strip() == source
          assert git("show", "-s", "--format=%P", source).decode().split() == [base, head]
          assert not git("status", "--porcelain").strip()
          remote = git("remote", "get-url", "origin").decode().strip()
          assert remote in {
              "https://github.com/Denissvgn/python-wiki-llm",
              "https://github.com/Denissvgn/python-wiki-llm.git",
              "git@github.com:Denissvgn/python-wiki-llm.git",
          }
          assert os.environ["GITHUB_REPOSITORY"] == "Denissvgn/python-wiki-llm"
          workflow_path = ".github/workflows/windows-measurement.yml"
          workflow_sha = os.environ["GITHUB_WORKFLOW_SHA"]
          workflow_ref = os.environ["GITHUB_WORKFLOW_REF"]
          assert re.fullmatch(r"[0-9a-f]{40}", workflow_sha)
          assert workflow_ref.startswith("Denissvgn/python-wiki-llm/" + workflow_path + "@")
          workflow_blob = git("rev-parse", source + ":" + workflow_path).decode().strip()
          assert hashlib.sha256(git("show", source + ":" + workflow_path)).hexdigest() == sha(
              root / workflow_path
          )
          identity = {
              "schema_version": "native-measurement-regression/v1",
              "purpose": "fixed-module native regression; not release qualification or policy ownership",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "candidate_sha": source,
              "head_sha": head,
              "base_sha": base,
              "canonical_origin": remote,
              "tree": git("rev-parse", "HEAD^{tree}").decode().strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "module": target,
              "module_sha256": sha(root / target),
              "python": platform.python_version(),
              "platform": sys.platform,
              "machine": platform.machine(),
              "executable": sys.executable,
              "prefix": sys.prefix,
              "workflow_sha": workflow_sha,
              "workflow_ref": workflow_ref,
              "workflow_blob": workflow_blob,
              "workflow_file_sha256": sha(root / workflow_path),
              "publication_authority": False,
          }
          save("identity.json", identity)
          # Load only pure base-owned readers and the complete-collection witness.
          tools = out / "base-tools"
          tools.mkdir()
          for name in ("pr_ci_pytest.py", "core_shards.py", "qualification.py"):
              (tools / name).write_bytes(git("show", base + ":release/" + name))
          save("base-reader-hashes.json", {p.name: sha(p) for p in tools.iterdir()})
          spec = importlib.util.spec_from_file_location(
              "base_native_junit_reader", tools / "core_shards.py"
          )
          reader = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reader)
          witness_spec = importlib.util.spec_from_file_location(
              "base_measurement_collection", tools / "pr_ci_pytest.py"
          )
          witness = importlib.util.module_from_spec(witness_spec)
          witness_spec.loader.exec_module(witness)
          assert Path(witness.__file__).resolve() == (tools / "pr_ci_pytest.py").resolve()
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          package = root / "src/llm_wiki_cli"
          files = set(package.rglob("*.py"))
          for pattern in project["tool"]["setuptools"]["package-data"]["llm_wiki_cli"]:
              files.update(package.glob(pattern))
          expected = {p.relative_to(package).as_posix(): sha(p) for p in files if p.is_file()}
          save(
              "expected-provider.json",
              {"version": project["project"]["version"], "files": expected},
          )
          probe = """
          import hashlib,importlib.metadata,json,pathlib,sys
          want=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          import llm_wiki_cli
          package=pathlib.Path(llm_wiki_cli.__file__).resolve().parent
          assert package.is_relative_to(pathlib.Path(sys.prefix).resolve()) and 'site-packages' in package.parts
          actual={}
          for path in package.rglob('*'):
           assert not path.is_symlink()
           if path.is_file() and '__pycache__' not in path.relative_to(package).parts and path.suffix!='.pyc':
            actual[path.relative_to(package).as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual==want['files'] and importlib.metadata.version('agent-wiki-cli')==want['version']
          print(json.dumps({'provider':str(package),'files':len(actual),'version':want['version']}))
          """


          def origin(name):
              value = subprocess.check_output(
                  [sys.executable, "-I", "-c", probe, str(out / "expected-provider.json")],
                  text=True,
              )
              save(name, json.loads(value))


          origin("installed-origin-before.json")
          assert not os.environ.get("PYTEST_ADDOPTS") and not os.environ.get("PYTEST_PLUGINS")
          sys.path.insert(0, str(root))
          sys.path.insert(0, str(tools))
          os.environ["PR_CI_COLLECTION"] = str(out / "collection.json")
          pytest = importlib.import_module("pytest")


          class Started:
              def pytest_runtest_logstart(self, nodeid, location):
                  with (out / "started.jsonl").open("a", encoding="utf-8") as journal:
                      journal.write(json.dumps(nodeid) + "\n")


          (out / "started.jsonl").write_bytes(b"")
          basetemp = out / "pytest"
          args = [
              target,
              "-q",
              "-p",
              "no:cacheprovider",
              "--strict-config",
              "--strict-markers",
              "-W",
              "error",
              "-o",
              "xfail_strict=true",
              "--junitxml=" + str(out / "junit.xml"),
              "--basetemp=" + str(basetemp),
          ]
          save(
              "command.json",
              {
                  "actual_runner_orig_argv": sys.orig_argv,
                  "actual_runner_argv": sys.argv,
                  "pytest_args": args,
                  "executed_via": "isolated stdin controller invokes pytest.main",
                  "collection_witness": {
                      "file": str(Path(witness.__file__).resolve()),
                      "sha256": sha(tools / "pr_ci_pytest.py"),
                  },
                  "started_witness": "inline Started.pytest_runtest_logstart",
                  "arbitrary_selector_input": False,
              },
          )

          started_at = time.time()
          exit_code = None
          capture = {
              "complete": False,
              "data_only": True,
              "limit_bytes": 128 * 1024 * 1024,
              "limit_files": 5000,
              "files": {},
              "temporary_aliases_not_followed": [],
              "measurement_roots": [],
          }
          try:
              exit_code = int(pytest.main(args, plugins=[witness, Started()]))
          finally:
              # Preserve even partial inner reports from a timed-out fresh worker. Never
              # follow links or adopt a path outside this run's owned temp directory.
              total = 0
              try:
                  with tarfile.open(
                      out / "measurement-reports.tar", "w", dereference=True
                  ) as archive:
                      for measurements in basetemp.glob("*/measurements"):
                          case_root = measurements.parent
                          if case_root.is_symlink() or case_root.is_junction():
                              capture["temporary_aliases_not_followed"].append(case_root.name)
                              continue
                          assert (
                              measurements.is_dir()
                              and not measurements.is_symlink()
                              and not measurements.is_junction()
                          )
                          capture["measurement_roots"].append(
                              measurements.relative_to(basetemp).as_posix()
                          )
                          for path in sorted(measurements.rglob("*")):
                              assert not path.is_symlink() and not path.is_junction()
                              if not path.is_file():
                                  continue
                              before = path.stat()
                              assert stat.S_ISREG(before.st_mode)
                              total += before.st_size
                              assert (
                                  total <= capture["limit_bytes"]
                                  and len(capture["files"]) < capture["limit_files"]
                              )
                              name = path.relative_to(basetemp).as_posix()
                              checksum = sha(path)
                              archive.add(path, arcname=name, recursive=False)
                              after = path.stat()
                              assert (before.st_size, before.st_mtime_ns, before.st_ino) == (
                                  after.st_size,
                                  after.st_mtime_ns,
                                  after.st_ino,
                              )
                              capture["files"][name] = {
                                  "sha256": checksum,
                                  "bytes": before.st_size,
                                  "mode": oct(before.st_mode & 0o777),
                              }
                  capture.update(
                      complete=True,
                      bytes=total,
                      archive_sha256=sha(out / "measurement-reports.tar"),
                  )
              except BaseException as error:
                  capture.update(
                      error_type=type(error).__name__, error=str(error)[:1000], bytes=total
                  )
              save("raw-reports-inventory.json", capture)
              save(
                  "execution.json",
                  {
                      "pytest_exit_code": exit_code,
                      "seconds": time.time() - started_at,
                      "raw_capture_complete": capture["complete"],
                  },
              )
          assert exit_code == 0 and capture["complete"]
          assert len(capture["measurement_roots"]) == 5
          collection = json.loads((out / "collection.json").read_text(encoding="utf-8"))
          nodes = reader.inventory(collection["collected"])
          assert collection["deselected"] == [] and set(collection["selected"]) == set(nodes)
          assert all(node.startswith(target + "::") for node in nodes)
          critical = target + "::test_timed_read_and_mutation_restore_equivalent_inputs"
          assert {
              critical + "[" + group + "]"
              for group in (
                  "context-v1-v2",
                  "changed-sync",
                  "unchanged-sync",
                  "prose-reanchor",
                  "strict-validation",
              )
          } <= set(nodes)
          started = [
              json.loads(line)
              for line in (out / "started.jsonl").read_text(encoding="utf-8").splitlines()
          ]
          assert Counter(started) == Counter(nodes)
          cases = reader.junit(out / "junit.xml")
          assert set(cases) == set(nodes)
          assert all(
              not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
              for case in cases.values()
          )
          assert not git("status", "--porcelain", "--untracked-files=no").strip()
          origin("installed-origin-after.json")
          save(
              "result.json",
              {
                  **identity,
                  "status": "passed",
                  "collected": len(nodes),
                  "started": len(started),
                  "passed": len(cases),
                  "skipped": 0,
                  "deselected": 0,
                  "junit_sha256": sha(out / "junit.xml"),
                  "raw_capture_complete": True,
                  "qualification": False,
                  "source_tracked_tree_unchanged": True,
              },
          )
          PY
      - name: Preserve complete or partial native regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: native-windows-measurement-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/measurement-${{ matrix.python }}/identity.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/installed-origin-before.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/installed-origin-after.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/expected-provider.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/command.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/collection.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/started.jsonl
            ${{ runner.temp }}/measurement-${{ matrix.python }}/junit.xml
            ${{ runner.temp }}/measurement-${{ matrix.python }}/execution.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/result.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/pip-install.log
            ${{ runner.temp }}/measurement-${{ matrix.python }}/pip-check.log
            ${{ runner.temp }}/measurement-${{ matrix.python }}/dependencies.txt
            ${{ runner.temp }}/measurement-${{ matrix.python }}/native-module.log
            ${{ runner.temp }}/measurement-${{ matrix.python }}/measurement-reports.tar
            ${{ runner.temp }}/measurement-${{ matrix.python }}/raw-reports-inventory.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-reader-hashes.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-tools/pr_ci_pytest.py
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-tools/core_shards.py
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-tools/qualification.py
          if-no-files-found: error
          retention-days: 14
