name: Native Windows measurement regression

on:
  pull_request:
    branches: [main]
    paths:
      - src/llm_wiki_cli/**
      - release/**
      - pyproject.toml
      - .github/scripts/setup-llm-wiki-ci-toolchains.sh
      - .github/workflows/release-qualification.yml
      - integrations/wiki-integrity/action.yml
      - tests/test_developer_value_measure.py
      - tests/__init__.py
      - tests/conftest.py
      - tests/pytest_portability.py
      - tests/developer_value/**
      - tests/provider_conformance/**
      - .github/workflows/windows-measurement.yml

permissions:
  contents: read

concurrency:
  group: windows-measurement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  measurement:
    name: Windows measurement (${{ matrix.python }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Run once on the release patch; reuse it for setup and evidence names.
        python: ["3.13.17"]
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PYTHON: ${{ matrix.python }}
      CANDIDATE_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Initialize bounded evidence before interpreter setup
        shell: pwsh
        env:
          EVIDENCE: ${{ runner.temp }}/measurement-${{ matrix.python }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          "EVIDENCE=$env:EVIDENCE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            schema_version = "native-measurement-bootstrap/v1"
            purpose = "setup trace only; no runtime or test success established"
            repository = $env:GITHUB_REPOSITORY
            candidate_sha = $env:CANDIDATE_SHA
            head_sha = $env:HEAD_SHA
            base_sha = $env:BASE_SHA
            run_id = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            requested_python = $env:EXPECTED_PYTHON
            workflow_sha = $env:GITHUB_WORKFLOW_SHA
            workflow_ref = $env:GITHUB_WORKFLOW_REF
          } | ConvertTo-Json | Set-Content -Path (Join-Path $env:EVIDENCE "bootstrap-identity.json") -Encoding utf8
      - name: Check out the exact PR test merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up the native Windows interpreter
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create a fresh environment and install the exact candidate
        env:
          BOOTSTRAP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "${BOOTSTRAP_PYTHON}" -m venv .venv
          .venv/Scripts/python.exe -m pip install --no-cache-dir ".[dev,tokens]" 2>&1 | tee "${EVIDENCE}/pip-install.log"
          .venv/Scripts/python.exe -m pip check 2>&1 | tee "${EVIDENCE}/pip-check.log"
          .venv/Scripts/python.exe -m pip freeze --all > "${EVIDENCE}/dependencies.txt"
      - name: Verify source and provider, then run only the complete measurement module
        run: |
          set -euo pipefail
          .venv/Scripts/python.exe -I release/measurement_canary.py \
            --root . --output "${EVIDENCE}" \
            --expected-python "${EXPECTED_PYTHON}" --source-sha "${CANDIDATE_SHA}" \
            2>&1 | tee "${EVIDENCE}/native-module.log"
      - name: Preserve complete or partial native regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: native-windows-measurement-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/measurement-${{ matrix.python }}/bootstrap-identity.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/identity.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/installed-origin-before.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/installed-origin-after.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/expected-provider.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/command.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/collection.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/started.jsonl
            ${{ runner.temp }}/measurement-${{ matrix.python }}/junit.xml
            ${{ runner.temp }}/measurement-${{ matrix.python }}/execution.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/result.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/pip-install.log
            ${{ runner.temp }}/measurement-${{ matrix.python }}/pip-check.log
            ${{ runner.temp }}/measurement-${{ matrix.python }}/dependencies.txt
            ${{ runner.temp }}/measurement-${{ matrix.python }}/native-module.log
            ${{ runner.temp }}/measurement-${{ matrix.python }}/measurement-reports.tar
            ${{ runner.temp }}/measurement-${{ matrix.python }}/raw-reports-inventory.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-reader-hashes.json
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-tools/pr_ci_pytest.py
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-tools/core_shards.py
            ${{ runner.temp }}/measurement-${{ matrix.python }}/base-tools/qualification.py
          if-no-files-found: error
          retention-days: 14
