name: Dependency setup comparison

on:
  pull_request:
    paths:
      - .github/workflows/dependency-setup-check.yml
      - .github/workflows/release-qualification.yml
      - release/dependency_downloads.py
      - release/dependency_setup_probe.py
      - release/*requirements.in
      - release/*requirements.txt
      - tests/test_dependency_downloads.py
      - tests/test_dependency_setup_probe.py
      - tests/test_dependency_setup_workflow.py
      - tests/verify_installed_knowledge_schema.py
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Full pushed branch-tip SHA; leave empty to use this branch tip
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_NO_INPUT: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  freeze:
    name: Freeze dependency comparison inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      inputs-sha256: ${{ steps.freeze.outputs.inputs-sha256 }}
      python-version: ${{ steps.python.outputs.python-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python
        with:
          python-version: '3.13'
      - name: Freeze the exact source and comparison helpers
        id: freeze
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "${EVENT}" == "workflow_dispatch" && "${WORKFLOW_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "Dispatch from a branch whose tip is the candidate SHA" >&2
            exit 1
          fi
          python -I release/dependency_setup_probe.py freeze \
            --candidate "${CANDIDATE_SHA}" --output "${RUNNER_TEMP}/dependency-inputs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: dependency-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  controls:
    name: Fresh builders and all cache controls
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build-cache-key: ${{ steps.controls.outputs.build-cache-key }}
      validation-cache-key: ${{ steps.controls.outputs.validation-cache-key }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: dependency-inputs-${{ github.run_attempt }}
          path: incoming
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ needs.freeze.outputs.python-version }}
      - name: Verify the helper before executing it
        env:
          INPUTS_SHA256: ${{ needs.freeze.outputs.inputs-sha256 }}
        run: >-
          python -I -c 'import hashlib,json,pathlib,sys; root=pathlib.Path("incoming"); raw=(root/"inputs.json").read_bytes(); assert hashlib.sha256(raw).hexdigest()==sys.argv[1]; manifest=json.loads(raw); assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in manifest["files"].items())'
          "${INPUTS_SHA256}"
      - name: Exercise full-lock baseline and every isolated cache path
        id: controls
        env:
          INPUTS_SHA256: ${{ needs.freeze.outputs.inputs-sha256 }}
        run: |
          for mode in baseline cold warm stale corrupt unavailable; do
            python -I incoming/dependency_setup_probe.py run \
              --inputs incoming --inputs-sha256 "${INPUTS_SHA256}" \
              --case "${mode}" --work "work/${mode}" --output "evidence/${mode}" \
              --cache "${RUNNER_TEMP}/third-party-downloads" \
              --namespace release
          done
          python -I incoming/dependency_setup_probe.py compare \
            --result evidence/baseline/comparison.json --result evidence/cold/comparison.json \
            --result evidence/warm/comparison.json --result evidence/stale/comparison.json \
            --result evidence/corrupt/comparison.json --result evidence/unavailable/comparison.json \
            --output evidence/comparison.json
      - name: Begin cache-save measurement
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && !github.event.repository.fork }}
        id: save-start
        run: python -I -c 'import os,time; open(os.environ["GITHUB_OUTPUT"],"a").write("started="+str(time.time_ns())+"\n")'
      - name: Save verified build downloads for the separate warm job
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && !github.event.repository.fork }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/third-party-downloads/build
          key: ${{ steps.controls.outputs.build-cache-key }}
      - name: Save verified validation downloads for the separate warm job
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && !github.event.repository.fork }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/third-party-downloads/validation
          key: ${{ steps.controls.outputs.validation-cache-key }}
      - name: Record cache-save overhead
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && !github.event.repository.fork }}
        env:
          STARTED: ${{ steps.save-start.outputs.started }}
        run: python -I -c 'import json,os,pathlib,time; pathlib.Path("evidence/cache-save.json").write_text(json.dumps({"seconds":(time.time_ns()-int(os.environ["STARTED"]))/1e9}))'
      - name: Retain complete or partial dependency controls
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: dependency-controls-${{ github.run_attempt }}
          path: |
            evidence/**/comparison.json
            evidence/**/setup.json
            evidence/**/*.log
            evidence/cache-save.json
          if-no-files-found: warn
          retention-days: 14

  warm:
    name: Native cache-service hit with fresh builders
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && !github.event.repository.fork }}
    needs: [freeze, controls]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: dependency-inputs-${{ github.run_attempt }}
          path: incoming
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ needs.freeze.outputs.python-version }}
      - name: Verify the helper before executing it
        env:
          INPUTS_SHA256: ${{ needs.freeze.outputs.inputs-sha256 }}
        run: >-
          python -I -c 'import hashlib,json,pathlib,sys; root=pathlib.Path("incoming"); raw=(root/"inputs.json").read_bytes(); assert hashlib.sha256(raw).hexdigest()==sys.argv[1]; manifest=json.loads(raw); assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in manifest["files"].items())'
          "${INPUTS_SHA256}"
      - name: Begin cache-restore measurement
        id: restore-start
        run: python -I -c 'import os,time; open(os.environ["GITHUB_OUTPUT"],"a").write("started="+str(time.time_ns())+"\n")'
      - name: Restore the exact build downloads
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/third-party-downloads/build
          key: ${{ needs.controls.outputs.build-cache-key }}
          fail-on-cache-miss: true
      - name: Restore the exact validation downloads
        id: validation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/third-party-downloads/validation
          key: ${{ needs.controls.outputs.validation-cache-key }}
          fail-on-cache-miss: true
      - name: Require actual hits and compare fresh warm builders
        env:
          INPUTS_SHA256: ${{ needs.freeze.outputs.inputs-sha256 }}
          STARTED: ${{ steps.restore-start.outputs.started }}
          BUILD_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          VALIDATION_HIT: ${{ steps.validation-cache.outputs.cache-hit }}
        run: |
          test "${BUILD_HIT}" = "true"
          test "${VALIDATION_HIT}" = "true"
          elapsed="$(python -I -c 'import os,time; print((time.time_ns()-int(os.environ["STARTED"]))/1e9)')"
          python -I incoming/dependency_setup_probe.py run \
            --inputs incoming --inputs-sha256 "${INPUTS_SHA256}" \
            --case warm --work work/warm --output evidence/warm \
            --cache "${RUNNER_TEMP}/third-party-downloads" \
            --namespace release \
            --cache-restore-seconds "${elapsed}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: dependency-controls-${{ github.run_attempt }}
          path: controls
      - name: Require the same artifacts and consumer results for all six cases
        run: >-
          python -I incoming/dependency_setup_probe.py compare
          --result controls/baseline/comparison.json --result controls/cold/comparison.json
          --result evidence/warm/comparison.json --result controls/stale/comparison.json
          --result controls/corrupt/comparison.json --result controls/unavailable/comparison.json
          --output evidence/comparison.json
      - name: Retain native cache-service comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: dependency-warm-${{ github.run_attempt }}
          path: |
            evidence/**/comparison.json
            evidence/**/setup.json
            evidence/**/*.log
          if-no-files-found: warn
          retention-days: 14
