name: Feature request
description: Suggest a new capability or behavior change for LLM Wiki CLI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the CLI behavior, generated output, or docs change you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent schemas and hooks
        - Bootstrap or sync
        - Extractors
        - Linting
        - Migration
        - Context budgeting
        - Documentation
        - Packaging or release
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe workarounds or alternate designs.
    validations:
      required: false
  - type: textarea
    id: stack
    attributes:
      label: Stack and environment
      description: Languages, frameworks, OS, Python version, and agent host relevant to this request.
    validations:
      required: true
  - type: textarea
    id: repository_shape
    attributes:
      label: Repository size and layout
      description: Approximate source file count, mono-repo or single package, and relevant source roots.
    validations:
      required: true
  - type: textarea
    id: blocked_task
    attributes:
      label: Blocked task and current workaround
      description: Describe a concrete task, the expected result, and how you complete it today (or why you cannot).
    validations:
      required: true
  - type: input
    id: representative_repository
    attributes:
      label: Representative repository or example
      description: Optional public link or minimal example. Do not include credentials or private source code.
    validations:
      required: false
  - type: textarea
    id: baseline_cost
    attributes:
      label: Current time and rework
      description: Optional. Include the observation date, task duration, retries or manual corrections, and how you measured them. Unknown is fine.
    validations:
      required: false
  - type: dropdown
    id: pilot_availability
    attributes:
      label: Availability for a bounded pilot
      options:
        - No pilot participation requested
        - I can provide an example and feedback on this issue
        - I can try the workflow on a representative repository
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note any impact on existing wikis, manifests, hooks, agent schemas, or CI usage.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
